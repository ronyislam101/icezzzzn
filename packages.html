<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packages - ICE FISHING</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0e1a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #0a0e1a;
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            user-select: none;
            animation: fall linear infinite;
        }
        .particle.ice {
            color: rgba(100, 200, 255, 0.05);
            font-size: 0.9rem;
        }
        .particle.fish {
            color: rgba(77, 201, 246, 0.04);
            font-size: 1rem;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.05; }
            90% { opacity: 0.05; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        .header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .brand .logo {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(77, 201, 246, 0.15));
        }

        .header .brand h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header .brand h1 span {
            color: #4dc9f6;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        /* ============================================================
           PAGE TITLE
           ============================================================ */
        .page-title {
            margin-bottom: 20px;
        }

        .page-title h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .page-title p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           USDT/INR RATE
           ============================================================ */
        .rate-banner {
            background: rgba(255, 215, 0, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 12px;
            padding: 10px 16px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rate-banner .label {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .rate-banner .rate {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffd700;
        }

        .rate-banner .rate span {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        /* ============================================================
           PACKAGE LIST
           ============================================================ */
        .package-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .package-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .package-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .package-item .left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .package-item .left .name {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .package-item .left .name .badge {
            font-size: 0.5rem;
            font-weight: 600;
            background: rgba(255, 215, 0, 0.1);
            color: #ffd700;
            padding: 1px 10px;
            border-radius: 10px;
            margin-left: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .package-item .left .duration {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
        }

        .package-item .right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 1px;
            min-width: 100px;
        }

        .package-item .right .usdt {
            font-size: 1rem;
            font-weight: 700;
            color: #4dc9f6;
        }

        .package-item .right .usdt .currency {
            font-size: 0.6rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.1);
        }

        .package-item .right .inr {
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
        }

        .package-item .right .inr .currency {
            font-size: 0.5rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.06);
        }

        .package-item .right .arrow {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.05);
            margin-top: 2px;
        }

        .package-item.popular {
            border-color: rgba(255, 215, 0, 0.08);
            background: rgba(255, 215, 0, 0.02);
        }

        .package-item.popular:hover {
            border-color: rgba(255, 215, 0, 0.15);
            background: rgba(255, 215, 0, 0.03);
        }

        /* ============================================================
           ADMIN NOTE
           ============================================================ */
        .admin-note {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px dashed rgba(255, 255, 255, 0.03);
            text-align: center;
        }

        .admin-note p {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.04);
            letter-spacing: 0.5px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .header .brand h1 { font-size: 1rem; }
            .header .brand .logo { font-size: 1.5rem; }
            .page-title h2 { font-size: 1.1rem; }
            .package-item { padding: 14px 14px; }
            .package-item .left .name { font-size: 0.85rem; }
            .package-item .right .usdt { font-size: 0.9rem; }
            .package-item .right .inr { font-size: 0.65rem; }
            .rate-banner { flex-direction: row; gap: 6px; padding: 8px 14px; }
            .rate-banner .rate { font-size: 0.8rem; }
        }

        @media (max-width: 380px) {
            .package-item { padding: 12px 10px; }
            .package-item .left .name { font-size: 0.75rem; }
            .package-item .right .usdt { font-size: 0.8rem; }
            .package-item .right { min-width: 80px; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div id="particles"></div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="brand">
                <span class="logo">🎣</span>
                <h1>ICE <span>FISHING</span></h1>
            </div>
            <!-- Back button goes to Login Page -->
            <a href="index.html" class="back-btn">← Back</a>
        </div>

        <!-- Page Title -->
        <div class="page-title">
            <h2>📦 Choose Your Package</h2>
            <p>Select a package to start your ICE FISHING adventure</p>
        </div>

        <!-- USDT/INR Rate -->
        <div class="rate-banner">
            <span class="label">💱 Live Rate</span>
            <span class="rate" id="rateDisplay">1 USDT = ₹<span id="inrRate">--</span></span>
        </div>

        <!-- Package List -->
        <div class="package-list" id="packageList">
            <!-- Packages loaded from Firebase -->
            <div style="text-align:center; padding:30px 0; color:rgba(255,255,255,0.04);">
                <p>Loading packages...</p>
            </div>
        </div>

        <!-- Admin Note -->
        <div class="admin-note">
            <p>🛠️ Prices can be changed by admin from Firebase Console</p>
        </div>

    </div>

    <!-- ============================================================
       FIREBASE SDK
       ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        // PARTICLES
        // ============================================================
        (function createParticles() {
            const container = document.getElementById('particles');
            const ice = ['❄️', '✦', '❄️', '✦'];
            const fish = ['🐟', '🐠', '🐡'];

            for (let i = 0; i < 25; i++) {
                const el = document.createElement('div');
                const isFish = Math.random() < 0.3;
                el.className = 'particle ' + (isFish ? 'fish' : 'ice');
                el.textContent = isFish ?
                    fish[Math.floor(Math.random() * fish.length)] :
                    ice[Math.floor(Math.random() * ice.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 0.8 + 0.5) + 'rem';
                el.style.animationDuration = (Math.random() * 18 + 12) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(el);
            }
        })();

        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let usdtToInr = 85.0;
        let packages = [];

        // ============================================================
        // DEFAULT PACKAGES (Corrected Prices)
        // ============================================================
        const defaultPackages = [{
            id: 'starter',
            name: '1-Hour Starter',
            duration: '1 Hour',
            usdt: 37.35,
            inr: 3100,
            popular: false,
            emoji: '⏰'
        }, {
            id: 'pro',
            name: '2-Hour Pro',
            duration: '2 Hours',
            usdt: 66.27,
            inr: 5500,
            popular: false,
            emoji: '🎯'
        }, {
            id: 'ultimate',
            name: '4-Hour Ultimate',
            duration: '4 Hours',
            usdt: 126.51,
            inr: 10500,
            popular: true,
            emoji: '🔥'
        }, {
            id: 'daypass',
            name: '12-Hour Day Pass',
            duration: '12 Hours',
            usdt: 307.23,
            inr: 25500,
            popular: false,
            emoji: '☀️'
        }, {
            id: 'access',
            name: '24-Hour Access',
            duration: '24 Hours',
            usdt: 487.95,
            inr: 40500,
            popular: false,
            emoji: '🌙'
        }];

        // ============================================================
        // FETCH USDT/INR RATE
        // ============================================================
        async function fetchUSDTRate() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=inr');
                const data = await response.json();
                if (data && data.tether && data.tether.inr) {
                    usdtToInr = data.tether.inr;
                    document.getElementById('inrRate').textContent = usdtToInr.toFixed(2);
                } else {
                    document.getElementById('inrRate').textContent = usdtToInr.toFixed(2);
                }
            } catch (error) {
                console.error('Error fetching USDT rate:', error);
                document.getElementById('inrRate').textContent = usdtToInr.toFixed(2);
            }
        }

        // ============================================================
        // LOAD PACKAGES FROM FIREBASE
        // ============================================================
        function loadPackages() {
            db.collection('packagePrices')
                .doc('packages')
                .get()
                .then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        packages = defaultPackages.map(pkg => {
                            const firebasePkg = data[pkg.id];
                            if (firebasePkg) {
                                return {
                                    ...pkg,
                                    usdt: firebasePkg.usdt || pkg.usdt,
                                    inr: firebasePkg.inr || pkg.inr,
                                    name: firebasePkg.name || pkg.name,
                                    duration: firebasePkg.duration || pkg.duration,
                                    popular: firebasePkg.popular !== undefined ? firebasePkg.popular : pkg
                                    .popular,
                                    emoji: firebasePkg.emoji || pkg.emoji
                                };
                            }
                            return pkg;
                        });
                    } else {
                        // Create default document in Firebase
                        const defaultData = {};
                        defaultPackages.forEach(pkg => {
                            defaultData[pkg.id] = {
                                name: pkg.name,
                                duration: pkg.duration,
                                usdt: pkg.usdt,
                                inr: pkg.inr,
                                popular: pkg.popular,
                                emoji: pkg.emoji
                            };
                        });
                        db.collection('packagePrices').doc('packages').set(defaultData);
                        packages = defaultPackages;
                    }
                    renderPackages();
                })
                .catch((error) => {
                    console.error('Error loading packages:', error);
                    packages = defaultPackages;
                    renderPackages();
                });
        }

        // ============================================================
        // RENDER PACKAGES
        // ============================================================
        function renderPackages() {
            const list = document.getElementById('packageList');

            if (packages.length === 0) {
                list.innerHTML = `
                    <div style="text-align:center; padding:30px 0; color:rgba(255,255,255,0.04);">
                        <p>No packages available</p>
                    </div>
                `;
                return;
            }

            let html = '';
            packages.forEach((pkg) => {
                const popularClass = pkg.popular ? 'popular' : '';
                const popularBadge = pkg.popular ? '<span class="badge">🔥 Popular</span>' : '';

                html += `
                    <a href="payment.html?package=${pkg.id}&from=login" class="package-item ${popularClass}">
                        <div class="left">
                            <div class="name">${pkg.emoji || ''} ${pkg.name} ${popularBadge}</div>
                            <div class="duration">${pkg.duration}</div>
                        </div>
                        <div class="right">
                            <div class="usdt">$${pkg.usdt.toFixed(2)} <span class="currency">USDT</span></div>
                            <div class="inr">₹${pkg.inr.toLocaleString()} <span class="currency">INR</span></div>
                            <div class="arrow">→</div>
                        </div>
                    </a>
                `;
            });

            list.innerHTML = html;
        }

        // ============================================================
        // INIT
        // ============================================================
        fetchUSDTRate();
        loadPackages();

        // Update rate every minute
        setInterval(() => {
            fetchUSDTRate();
        }, 60000);
    </script>

</body>
</html>

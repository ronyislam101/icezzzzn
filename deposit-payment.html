<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deposit Payment Methods - ICE FISHING</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* Same style as previous pages */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0e1a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #0a0e1a;
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            user-select: none;
            animation: fall linear infinite;
        }
        .particle.ice {
            color: rgba(100, 200, 255, 0.05);
            font-size: 0.9rem;
        }
        .particle.fish {
            color: rgba(77, 201, 246, 0.04);
            font-size: 1rem;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.05; }
            90% { opacity: 0.05; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        .header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .brand .logo {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(77, 201, 246, 0.15));
        }

        .header .brand h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header .brand h1 span {
            color: #4dc9f6;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        .page-title {
            margin-bottom: 20px;
        }

        .page-title h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .page-title p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .order-summary {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .order-summary .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
        }

        .order-summary .row .label {
            color: rgba(255, 255, 255, 0.15);
        }

        .order-summary .row .value {
            color: #ffffff;
            font-weight: 600;
        }

        .order-summary .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.03);
            margin: 8px 0;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .payment-method {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .payment-method:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .payment-method .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .payment-method .left .icon {
            font-size: 1.8rem;
            width: 40px;
            text-align: center;
        }

        .payment-method .left .info .name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
        }

        .payment-method .left .info .desc {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.12);
        }

        .payment-method .right .arrow {
            color: rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
        }

        .payment-method:hover .right .arrow {
            color: rgba(255, 255, 255, 0.15);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.02);
            letter-spacing: 2px;
        }

        .region-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 600;
            background: rgba(77, 201, 246, 0.06);
            color: #4dc9f6;
            margin-left: 6px;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header .brand h1 { font-size: 1rem; }
            .header .brand .logo { font-size: 1.5rem; }
            .page-title h2 { font-size: 1.1rem; }
            .payment-method { padding: 12px 14px; }
            .payment-method .left .icon { font-size: 1.4rem; width: 32px; }
            .payment-method .left .info .name { font-size: 0.8rem; }
            .order-summary .row { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div id="particles"></div>

    <div class="container">

        <div class="header">
            <div class="brand">
                <span class="logo">🎣</span>
                <h1>ICE <span>FISHING</span></h1>
            </div>
            <a href="deposit.html" class="back-btn" id="backBtn">← Back</a>
        </div>

        <div class="page-title">
            <h2>💰 Deposit Payment Methods</h2>
            <p>Select your preferred payment method</p>
        </div>

        <div class="order-summary" id="orderSummary">
            <div class="row">
                <span class="label">📍 Region</span>
                <span class="value" id="regionDisplay">--</span>
            </div>
            <div class="row">
                <span class="label">💰 Amount</span>
                <span class="value" id="amountDisplay">0</span>
            </div>
        </div>

        <div class="payment-methods" id="paymentMethods">
            <div style="text-align:center; padding:20px; color:rgba(255,255,255,0.05);">
                <p>Loading payment methods...</p>
            </div>
        </div>

        <div class="footer">
            Revo Flex © 2026
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        (function createParticles() {
            const container = document.getElementById('particles');
            const ice = ['❄️', '✦', '❄️', '✦'];
            const fish = ['🐟', '🐠', '🐡'];

            for (let i = 0; i < 25; i++) {
                const el = document.createElement('div');
                const isFish = Math.random() < 0.3;
                el.className = 'particle ' + (isFish ? 'fish' : 'ice');
                el.textContent = isFish ?
                    fish[Math.floor(Math.random() * fish.length)] :
                    ice[Math.floor(Math.random() * ice.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 0.8 + 0.5) + 'rem';
                el.style.animationDuration = (Math.random() * 18 + 12) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(el);
            }
        })();

        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const region = urlParams.get('region') || 'india';
        const amount = parseFloat(urlParams.get('amount')) || 0;
        const currency = urlParams.get('currency') || 'INR';
        const symbol = decodeURIComponent(urlParams.get('symbol') || '₹');
        let methods = [];

        const fallbackMethods = {
            bangladesh: [
                { id:'bkash', icon:'💚', name:'Bkash' },
                { id:'nagad', icon:'🟠', name:'Nagad' },
                { id:'rocket', icon:'🚀', name:'Rocket' }
            ],
            india: [
                { id:'paytm', icon:'💳', name:'Paytm' },
                { id:'upi', icon:'🇮🇳', name:'UPI' },
                { id:'phonepe', icon:'📱', name:'PhonePe' },
                { id:'gpay', icon:'💚', name:'GPay' }
            ],
            worldwide: [
                { id:'btc', icon:'₿', name:'Bitcoin' },
                { id:'eth', icon:'⟠', name:'Ethereum' },
                { id:'usdt', icon:'🪙', name:'Tether (USDT)' },
                { id:'usdc', icon:'💵', name:'USD Coin' },
                { id:'ltc', icon:'Ł', name:'Litecoin' },
                { id:'doge', icon:'🐕', name:'Dogecoin' },
                { id:'sol', icon:'☀️', name:'Solana' },
                { id:'bnb', icon:'🔶', name:'BNB' },
                { id:'trx', icon:'🔴', name:'Tron' }
            ]
        };

        const regionNames = {
            bangladesh: '🇧🇩 Bangladesh',
            india: '🇮🇳 India',
            worldwide: '🌍 Worldwide'
        };

        function normaliseAdminMethods(data) {
            if (!data || typeof data !== 'object') return [];
            let source = Array.isArray(data.methods) ? data.methods : Object.entries(data).map(([id,v]) => ({id, ...(v && typeof v === 'object' ? v : {})}));
            return source.filter(m => m && m.id && m.enabled !== false && m.active !== false)
                .filter(m => {
                    const regions = m.regions || m.region || m.availableRegions;
                    if (!regions) return true;
                    if (Array.isArray(regions)) return regions.includes(region) || regions.includes('all') || regions.includes('worldwide');
                    return String(regions).toLowerCase() === region || String(regions).toLowerCase() === 'all';
                })
                .map(m => ({
                    id: String(m.id),
                    icon: m.icon || '💳',
                    name: m.name || m.label || String(m.id).toUpperCase()
                }));
        }

        function renderPaymentMethods() {
            const regionDisplay = document.getElementById('regionDisplay');
            const amountDisplay = document.getElementById('amountDisplay');
            regionDisplay.textContent = regionNames[region] || 'Unknown';
            amountDisplay.textContent = symbol + ' ' + amount.toFixed(2) + ' ' + currency;

            const container = document.getElementById('paymentMethods');
            if (!methods.length) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:rgba(255,255,255,0.5);"><p>No payment methods available for this region.</p></div>`;
                return;
            }

            container.innerHTML = methods.map(method => {
                const qs = 'method=' + encodeURIComponent(method.id) +
                    '&amount=' + encodeURIComponent(amount) +
                    '&currency=' + encodeURIComponent(currency) +
                    '&symbol=' + encodeURIComponent(symbol) +
                    '&region=' + encodeURIComponent(region);
                return `<a href="payment-final.html?${qs}" class="payment-method">
                    <div class="left"><span class="icon">${method.icon}</span><div class="info">
                        <div class="name">${method.name}</div><div class="desc">${regionNames[region] || ''}</div>
                    </div></div><div class="right"><span class="arrow">→</span></div></a>`;
            }).join('');
        }

        async function loadPaymentMethods() {
            // First use the admin-managed paymentDetails document.
            try {
                const doc = await db.collection('paymentDetails').doc('methods').get();
                const adminMethods = normaliseAdminMethods(doc.exists ? doc.data() : null);
                if (adminMethods.length) {
                    methods = adminMethods;
                    renderPaymentMethods();
                    return;
                }
            } catch (e) {
                console.warn('Admin payment methods read failed:', e);
            }

            // Backward compatibility with the previous URL format.
            try {
                const methodsParam = urlParams.get('methods');
                if (methodsParam) methods = JSON.parse(decodeURIComponent(methodsParam));
            } catch (e) { console.warn('Legacy methods parse failed:', e); }

            if (!methods.length) methods = fallbackMethods[region] || fallbackMethods.worldwide;
            renderPaymentMethods();
        }


    </script>

</body>
</html>

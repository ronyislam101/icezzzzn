<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Methods - ICE FISHING</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* Same style as previous pages */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0e1a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #0a0e1a;
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            user-select: none;
            animation: fall linear infinite;
        }
        .particle.ice {
            color: rgba(100, 200, 255, 0.05);
            font-size: 0.9rem;
        }
        .particle.fish {
            color: rgba(77, 201, 246, 0.04);
            font-size: 1rem;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.05; }
            90% { opacity: 0.05; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        .header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .brand .logo {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(77, 201, 246, 0.15));
        }

        .header .brand h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header .brand h1 span {
            color: #4dc9f6;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        .page-title {
            margin-bottom: 20px;
        }

        .page-title h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .page-title p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .order-summary {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .order-summary .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
        }

        .order-summary .row .label {
            color: rgba(255, 255, 255, 0.15);
        }

        .order-summary .row .value {
            color: #ffffff;
            font-weight: 600;
        }

        .order-summary .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.03);
            margin: 8px 0;
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .payment-method {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .payment-method:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .payment-method .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .payment-method .left .icon {
            font-size: 1.8rem;
            width: 40px;
            text-align: center;
        }

        .payment-method .left .info .name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
        }

        .payment-method .left .info .desc {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.12);
        }

        .payment-method .right .arrow {
            color: rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
        }

        .payment-method:hover .right .arrow {
            color: rgba(255, 255, 255, 0.15);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.02);
            letter-spacing: 2px;
        }

        .region-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 0.6rem;
            font-weight: 600;
            background: rgba(77, 201, 246, 0.06);
            color: #4dc9f6;
            margin-left: 6px;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header .brand h1 { font-size: 1rem; }
            .header .brand .logo { font-size: 1.5rem; }
            .page-title h2 { font-size: 1.1rem; }
            .payment-method { padding: 12px 14px; }
            .payment-method .left .icon { font-size: 1.4rem; width: 32px; }
            .payment-method .left .info .name { font-size: 0.8rem; }
            .order-summary .row { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div id="particles"></div>

    <div class="container">

        <div class="header">
            <div class="brand">
                <span class="logo">🎣</span>
                <h1>ICE <span>FISHING</span></h1>
            </div>
            <a href="deposit.html" class="back-btn">← Back</a>
        </div>

        <div class="page-title">
            <h2>💳 Payment Methods</h2>
            <p>Select your preferred payment method</p>
        </div>

        <div class="order-summary" id="orderSummary">
            <div class="row">
                <span class="label">📍 Region</span>
                <span class="value" id="regionDisplay">--</span>
            </div>
            <div class="row">
                <span class="label">💰 Amount</span>
                <span class="value" id="amountDisplay">0</span>
            </div>
        </div>

        <div class="payment-methods" id="paymentMethods">
            <div style="text-align:center; padding:20px; color:rgba(255,255,255,0.05);">
                <p>Loading payment methods...</p>
            </div>
        </div>

        <div class="footer">
            Revo Flex © 2026
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        (function createParticles() {
            const container = document.getElementById('particles');
            const ice = ['❄️', '✦', '❄️', '✦'];
            const fish = ['🐟', '🐠', '🐡'];

            for (let i = 0; i < 25; i++) {
                const el = document.createElement('div');
                const isFish = Math.random() < 0.3;
                el.className = 'particle ' + (isFish ? 'fish' : 'ice');
                el.textContent = isFish ?
                    fish[Math.floor(Math.random() * fish.length)] :
                    ice[Math.floor(Math.random() * ice.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 0.8 + 0.5) + 'rem';
                el.style.animationDuration = (Math.random() * 18 + 12) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(el);
            }
        })();

        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const region = urlParams.get('region') || 'india';
        const amount = parseFloat(urlParams.get('amount')) || 0;
        const currency = urlParams.get('currency') || 'INR';
        const symbol = decodeURIComponent(urlParams.get('symbol') || '₹');
        let methods = [];

        try {
            const methodsParam = urlParams.get('methods');
            if (methodsParam) {
                methods = JSON.parse(decodeURIComponent(methodsParam));
            }
        } catch (e) {
            console.error('Error parsing methods:', e);
        }

        const regionNames = {
            bangladesh: '🇧🇩 Bangladesh',
            india: '🇮🇳 India',
            worldwide: '🌍 Worldwide'
        };

        async function loadAdminPaymentMethods() {
            try {
                const snap = await db.collection('paymentDetails').doc('methods').get();

                if (!snap.exists) {
                    renderPaymentMethods();
                    return;
                }

                const data = snap.data() || {};
                let raw = [];

                // Support the common admin structures:
                // { methods: [...] }, region arrays, or a keyed methods object.
                if (Array.isArray(data.methods)) {
                    raw = data.methods;
                } else {
                    const keys = [
                        region,
                        region === 'bangladesh' ? 'bd' : '',
                        region === 'india' ? 'in' : '',
                        region === 'worldwide' ? 'global' : ''
                    ].filter(Boolean);

                    for (const key of keys) {
                        if (Array.isArray(data[key])) {
                            raw = data[key];
                            break;
                        }
                        if (data[key] && Array.isArray(data[key].methods)) {
                            raw = data[key].methods;
                            break;
                        }
                    }

                    if (!raw.length) {
                        raw = Object.entries(data)
                            .filter(([, value]) => value && typeof value === 'object' && !Array.isArray(value))
                            .map(([id, value]) => ({ id, ...value }));
                    }
                }

                const wanted = String(region).toLowerCase();

                methods = raw
                    .filter(Boolean)
                    .filter(m => m.enabled !== false && m.active !== false)
                    .filter(m => {
                        const r = m.regions ?? m.region ?? m.availableRegions;
                        if (!r) return true;
                        const list = Array.isArray(r) ? r : [r];
                        return list.map(x => String(x).toLowerCase()).some(x =>
                            x === wanted || x === 'all' || x === 'worldwide' || x === '*'
                        );
                    })
                    .map(m => ({
                        id: String(m.id || m.key || m.code || m.name || '').trim(),
                        icon: m.icon || m.logo || m.emoji || '💳',
                        name: m.name || m.label || m.title || m.id || 'Payment Method',
                        description: m.description || m.desc || ''
                    }))
                    .filter(m => m.id);

                renderPaymentMethods();
            } catch (error) {
                console.error('Failed to load admin payment methods:', error);
                // Preserve any methods passed from the deposit page.
                renderPaymentMethods();
            }
        }

        function renderPaymentMethods() {
            const regionDisplay = document.getElementById('regionDisplay');
            const amountDisplay = document.getElementById('amountDisplay');

            regionDisplay.textContent = regionNames[region] || 'Unknown';
            amountDisplay.textContent = symbol + ' ' + amount.toFixed(2) + ' ' + currency;

            const container = document.getElementById('paymentMethods');

            if (!methods || methods.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding:20px; color:rgba(255,255,255,0.05);">
                        <p>No payment methods available for this region.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            methods.forEach((method) => {
                const regionBadge = regionNames[region] || '';
                html += `
                    <a href="payment-final.html?method=${method.id}&amount=${amount}&currency=${currency}&symbol=${encodeURIComponent(symbol)}&region=${region}" class="payment-method">
                        <div class="left">
                            <span class="icon">${method.icon}</span>
                            <div class="info">
                                <div class="name">${method.name}</div>
                                <div class="desc">${regionBadge}</div>
                            </div>
                        </div>
                        <div class="right">
                            <span class="arrow">→</span>
                        </div>
                    </a>
                `;
            });

            container.innerHTML = html;
        }

        loadAdminPaymentMethods();
    </script>

</body>
</html>

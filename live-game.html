<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ICE FISHING | Live Signals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0a0e17;
            --card: #111827;
            --card-hover: #1a2332;
            --border: #1e2a3a;
            --input: #0d1420;
            --blue: #3b82f6;
            --blue-dark: #1d4ed8;
            --text: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #4a5a7a;
            --gold: #fbbf24;
            --green: #34d399;
            --red: #f87171;
            --orange: #fb923c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: rgba(59,130,246,0.08);
            border: none;
            color: var(--blue);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(59,130,246,0.15);
        }
        .header h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header h1 span {
            color: var(--blue);
        }
        .header-status {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--green);
            background: rgba(52,211,153,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(52,211,153,0.15);
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 16px 16px 100px;
        }

        .hero {
            text-align: center;
            padding: 18px 0 12px;
        }
        .hero h2 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .hero h2 span {
            color: var(--blue);
        }
        .hero p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
        }

        .signal-card-main {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 20px 20px;
            margin: 16px 0;
            transition: all 0.3s;
        }

        .signal-card-main .label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 16px;
        }
        .signal-card-main .label i {
            color: var(--blue);
            margin-right: 6px;
        }

        .placeholder-box {
            text-align: center;
            padding: 30px 20px;
        }
        .placeholder-box i {
            font-size: 42px;
            color: var(--text-muted);
            opacity: 0.3;
            margin-bottom: 12px;
        }
        .placeholder-box .main-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .placeholder-box .sub-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .signal-display {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .signal-display.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Premium signal visual: the image owns the whole visual area.
           No extra black box/padding behind the image. */
        .signal-display .signal-visual {
            width: 100%;
            max-width: 430px;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 18px;
            background: transparent;
            position: relative;
            transform-origin: center;
        }

        .signal-display .signal-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: transparent;
            padding: 0;
            border-radius: 18px;
            will-change: transform, opacity, filter;
        }

        /* Medium-speed blink + gentle movement + subtle vibration.
           The image moves around a little, but never jumps wildly. */
        .signal-visual.animate-signal {
            animation: signal-breathe 1.8s ease-in-out 1,
                       signal-shake 1.8s ease-in-out 1;
        }

        .signal-visual.animate-signal .signal-image {
            animation: signal-blink 1.8s ease-in-out 1,
                       signal-float 1.8s ease-in-out 1;
        }

        @keyframes signal-blink {
            0%, 100% { opacity: 1; filter: brightness(1) drop-shadow(0 0 0 rgba(77,201,246,0)); }
            24% { opacity: .76; filter: brightness(1.08) drop-shadow(0 0 18px rgba(77,201,246,.22)); }
            48% { opacity: 1; filter: brightness(1.02) drop-shadow(0 0 10px rgba(77,201,246,.16)); }
            72% { opacity: .82; filter: brightness(1.06) drop-shadow(0 0 16px rgba(77,201,246,.20)); }
        }

        @keyframes signal-float {
            0%, 100% { transform: translate3d(0,0,0) rotate(0deg) scale(1); }
            22% { transform: translate3d(-5px,-2px,0) rotate(-.7deg) scale(1.015); }
            45% { transform: translate3d(5px,2px,0) rotate(.7deg) scale(1.02); }
            68% { transform: translate3d(-4px,1px,0) rotate(-.45deg) scale(1.012); }
        }

        @keyframes signal-shake {
            0%, 100% { transform: translate3d(0,0,0); }
            20% { transform: translate3d(-2px,0,0); }
            40% { transform: translate3d(2px,1px,0); }
            60% { transform: translate3d(-1.5px,-1px,0); }
            80% { transform: translate3d(1.5px,0,0); }
        }

        .signal-display .signal-name {
            font-size: 26px;
            font-weight: 800;
            margin-top: 12px;
            letter-spacing: -0.5px;
        }

        .signal-display .signal-type-badge {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 14px;
            border-radius: 20px;
            margin-top: 6px;
        }

        .signal-display .signal-type-badge.red {
            background: rgba(248,113,113,0.12);
            color: var(--red);
            border: 1px solid rgba(248,113,113,0.1);
        }
        .signal-display .signal-type-badge.orange {
            background: rgba(251,146,60,0.12);
            color: var(--orange);
            border: 1px solid rgba(251,146,60,0.1);
        }
        .signal-display .signal-type-badge.blue {
            background: rgba(59,130,246,0.12);
            color: var(--blue);
            border: 1px solid rgba(59,130,246,0.1);
        }

        .confidence-section {
            margin-top: 16px;
            width: 100%;
        }
        .confidence-section .top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .confidence-section .top .label {
            font-weight: 400;
        }
        .confidence-section .top .value {
            font-weight: 700;
        }
        .confidence-bar {
            width: 100%;
            height: 4px;
            background: var(--input);
            border-radius: 10px;
            overflow: hidden;
        }
        .confidence-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--blue-dark));
            width: 0%;
            transition: width 1s ease;
            border-radius: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }
        .btn {
            flex: 1;
            padding: 14px 12px;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), var(--blue-dark));
            color: #fff;
            box-shadow: 0 4px 20px rgba(59,130,246,0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(59,130,246,0.35);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-secondary:hover {
            background: var(--card-hover);
            border-color: var(--text-muted);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 12px;
            margin-top: 4px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .stat-item .label {
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59,130,246,0.1);
            border-top: 3px solid var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            .container { padding: 12px; }
            .signal-card-main { padding: 18px 16px; }
            .signal-display .signal-visual { max-width: 100%; aspect-ratio: 16 / 9; }
            .signal-display .signal-name { font-size: 20px; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 10px 8px; }
            .stat-item .value { font-size: 15px; }
            .btn { font-size: 10px; padding: 12px 8px; }
        }

        @media (max-width: 380px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
<style id="premium-signal-effects">
.signal-display .signal-visual{
 isolation:isolate; overflow:visible!important; border-radius:22px!important;
 background:radial-gradient(circle at 50% 50%,rgba(80,190,255,.10),transparent 58%),rgba(4,11,20,.22)!important;
 border:1px solid rgba(110,205,255,.12);
 box-shadow:0 18px 55px rgba(0,0,0,.34),inset 0 0 30px rgba(60,180,255,.035);
}
.signal-display .signal-visual:before{
 content:"";position:absolute;inset:-2px;border-radius:24px;pointer-events:none;z-index:-1;
 background:conic-gradient(from 0deg,transparent 0 72%,rgba(100,210,255,.34),transparent 86% 100%);
 filter:blur(10px);opacity:.55;animation:premiumRing 4s linear infinite;
}
.signal-display .signal-visual:after{
 content:"";position:absolute;width:72%;height:72%;left:14%;top:14%;border-radius:50%;pointer-events:none;
 background:radial-gradient(circle,rgba(86,201,255,.14),transparent 68%);
 filter:blur(18px);opacity:.7;animation:premiumAura 2.6s ease-in-out infinite;
}
.signal-display .signal-image{position:relative;z-index:2;object-fit:contain!important;image-rendering:auto;transform:translateZ(0);backface-visibility:hidden;filter:drop-shadow(0 12px 26px rgba(0,0,0,.32))}
.signal-visual.animate-signal{animation:premiumEnter .72s cubic-bezier(.2,.8,.2,1),premiumPulse 1.8s ease-in-out}
.signal-visual.animate-signal .signal-image{animation:premiumImageIn .85s cubic-bezier(.18,.85,.2,1),premiumFloat 2.4s ease-in-out .15s}
.signal-display .signal-name{text-shadow:0 0 22px rgba(88,200,255,.18);animation:premiumText .55s ease-out}
.signal-display .signal-type-badge{box-shadow:0 6px 22px rgba(0,0,0,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.confidence-bar{height:6px!important;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.confidence-bar .fill{box-shadow:0 0 12px rgba(59,160,255,.35)}
@keyframes premiumEnter{0%{opacity:0;transform:scale(.92) translateY(10px)}55%{opacity:1;transform:scale(1.015) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes premiumImageIn{0%{opacity:0;transform:scale(.88);filter:blur(5px) brightness(.8) drop-shadow(0 12px 26px rgba(0,0,0,.32))}55%{opacity:1;transform:scale(1.025);filter:blur(0) brightness(1.08) drop-shadow(0 12px 30px rgba(65,190,255,.22))}100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1) drop-shadow(0 12px 26px rgba(0,0,0,.32))}}
@keyframes premiumFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-4px,0) scale(1.008)}}
@keyframes premiumPulse{0%,100%{box-shadow:0 18px 55px rgba(0,0,0,.34),inset 0 0 30px rgba(60,180,255,.035)}45%{box-shadow:0 20px 65px rgba(0,0,0,.38),0 0 38px rgba(70,190,255,.11),inset 0 0 38px rgba(60,180,255,.06)}}
@keyframes premiumAura{0%,100%{transform:scale(.88);opacity:.45}50%{transform:scale(1.08);opacity:.82}}
@keyframes premiumRing{to{transform:rotate(360deg)}}
@keyframes premiumText{0%{opacity:0;transform:translateY(5px);filter:blur(2px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
@media (prefers-reduced-motion:reduce){.signal-display .signal-visual:before,.signal-display .signal-visual:after,.signal-visual.animate-signal,.signal-visual.animate-signal .signal-image,.signal-display .signal-name{animation:none!important}}
</style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
            <h1>🎣 <span>ICE FISHING</span></h1>
        </div>
        <span class="header-status"><i class="fas fa-circle" style="font-size:6px;margin-right:4px;"></i> LIVE</span>
    </div>

    <div class="container">

        <div class="hero">
            <h2><span>Live</span> Predictions</h2>
            <p>Real-time signals powered by AI</p>
        </div>

        <div class="signal-card-main">
            <div class="label"><i class="fas fa-bolt"></i> Current Signal</div>

            <div id="placeholderBox" class="placeholder-box">
                <i class="fas fa-wave-square"></i>
                <div class="main-text">Ready for signal</div>
                <div class="sub-text">Click "Get Signal" to start</div>
            </div>

            <div id="signalDisplay" class="signal-display">
                <div id="signalVisual" class="signal-visual">
                    <img id="signalImage" class="signal-image" src="" alt="Signal" decoding="async" fetchpriority="high">
                </div>
                <div class="signal-name" id="signalName">—</div>
                <span class="signal-type-badge" id="signalBadge">—</span>

                <div class="confidence-section">
                    <div class="top">
                        <span class="label">AI Confidence</span>
                        <span class="value" id="confidenceValue">0%</span>
                    </div>
                    <div class="confidence-bar">
                        <div class="fill" id="confidenceFill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="predictBtn">
                <i class="fas fa-magic"></i> Get Signal
            </button>
            <button class="btn btn-secondary" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="value" id="totalPredictions">0</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-item">
                <div class="value" id="accuracy">0%</div>
                <div class="label">Accuracy</div>
            </div>
            <div class="stat-item">
                <div class="value" id="bonusHits">0</div>
                <div class="label">Bonus</div>
            </div>
            <div class="stat-item">
                <div class="value" id="liveUsers">0</div>
                <div class="label">Live</div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // CLOUDINARY IMAGES
        // ============================================================
        const fishImages = {
            'red': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040428/fish-red_g9jmt4.png',
            'yellow': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040428/fish-yellow_zkxguo.png',
            'blue': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040428/fish-blue_niavh5.png',
            'darkleaf': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040427/Compressed_DARK_LEAF_2_2_intxk4.png',
            'whiteleaf': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040428/Compressed_white_leaf_wif8c8.png'
        };

        const signalTypes = {
            'red': { label: 'Huge Reds', badge: 'red', color: '#f87171' },
            'yellow': { label: 'Big Orange', badge: 'orange', color: '#fb923c' },
            'blue': { label: 'Lil Blues', badge: 'blue', color: '#3b82f6' },
            'darkleaf': { label: 'Dark Leaf', badge: 'orange', color: '#fb923c' },
            'whiteleaf': { label: 'White Leaf', badge: 'blue', color: '#3b82f6' }
        };

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let stats = { total: 1249, accuracy: 94, bonusHits: 128, liveUsers: 1247 };
        let isListening = false;
        let unsubscribeSignals = null;

        // ============================================================
        // DOM REFS
        // ============================================================
        const placeholderBox = document.getElementById('placeholderBox');
        const signalDisplay = document.getElementById('signalDisplay');
        const signalVisual = document.getElementById('signalVisual');
        const signalImage = document.getElementById('signalImage');
        const signalName = document.getElementById('signalName');
        const signalBadge = document.getElementById('signalBadge');
        const confidenceValue = document.getElementById('confidenceValue');
        const confidenceFill = document.getElementById('confidenceFill');
        const predictBtn = document.getElementById('predictBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        // ============================================================
        // FUNCTIONS
        // ============================================================
        function goBack() {
            window.location.href = 'dashboard.html';
        }

        function showLoading() {
            placeholderBox.innerHTML = `
                <div class="loading-spinner"></div>
                <div class="loading-text">Analyzing patterns...</div>
            `;
            placeholderBox.style.display = 'block';
            signalDisplay.classList.remove('active');
            signalDisplay.style.display = 'none';
        }

        function showSignal(signal, animate = true) {
            const imageUrl = fishImages[signal.imageKey] || fishImages['blue'];
            const typeInfo = signalTypes[signal.imageKey] || signalTypes['blue'];

            signalImage.src = imageUrl;
            signalImage.alt = signal.name || typeInfo.label;

            signalName.textContent = signal.name || typeInfo.label;
            signalName.style.color = typeInfo.color;

            signalBadge.textContent = typeInfo.label;
            signalBadge.className = 'signal-type-badge ' + typeInfo.badge;

            const confidence = Number.isFinite(Number(signal.confidence))
                ? Number(signal.confidence)
                : Math.floor(Math.random() * 20) + 75;
            confidenceValue.textContent = confidence + '%';
            confidenceFill.style.width = Math.max(0, Math.min(100, confidence)) + '%';

            placeholderBox.style.display = 'none';
            signalDisplay.style.display = 'flex';
            signalDisplay.classList.add('active');

            if (animate && signalVisual) {
                signalVisual.classList.remove('animate-signal');
                // Force a reflow so every new signal gets the full animation.
                void signalVisual.offsetWidth;
                signalVisual.classList.add('animate-signal');
                setTimeout(() => signalVisual.classList.remove('animate-signal'), 1900);
            }
        }

        function randomSignal() {
            const keys = ['red', 'yellow', 'blue', 'darkleaf', 'whiteleaf'];
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const typeInfo = signalTypes[randomKey];
            return {
                name: typeInfo.label,
                imageKey: randomKey,
                confidence: Math.floor(Math.random() * 20) + 75
            };
        }

        function showDefaultSignal() {
            showSignal(randomSignal());
        }

        function showNoSignal() {
            placeholderBox.innerHTML = `
                <i class="fas fa-wave-square"></i>
                <div class="main-text">Ready for signal</div>
                <div class="sub-text">Click "Get Signal" to start</div>
            `;
            placeholderBox.style.display = 'block';
            signalDisplay.classList.remove('active');
            signalDisplay.style.display = 'none';
        }

        function updateStats() {
            document.getElementById('totalPredictions').textContent = stats.total.toLocaleString();
            document.getElementById('accuracy').textContent = stats.accuracy + '%';
            document.getElementById('bonusHits').textContent = stats.bonusHits;
            document.getElementById('liveUsers').textContent = (stats.liveUsers / 1000).toFixed(1) + 'k';
        }

        // ============================================================
        // ADMIN SIGNAL CONTROL — CLICK TO PREDICT ONLY
        // Firestore document: settings/liveSignalControl
        //
        // Admin can control Single / Multiple / Random modes, but the
        // user app NEVER shows or changes a signal automatically.
        // A signal is shown only when the user clicks Get Signal.
        // There is NO time-based rotation.
        // One click = exactly ONE signal change.
        // ============================================================
        let liveControl = {
            enabled: true,
            mode: 'random',
            selectedSignal: 'blue',
            sequence: [],
            version: 0
        };
        let controlUnsubscribe = null;
        let predictionBusy = false;
        let sequenceIndex = 0;

        function normalizeSignal(raw) {
            if (!raw) return null;
            const imageKey = raw.imageKey || raw.id || raw.key;
            if (!fishImages[imageKey]) return null;
            const info = signalTypes[imageKey];
            return {
                name: raw.name || info.label,
                imageKey,
                confidence: Number.isFinite(Number(raw.confidence))
                    ? Number(raw.confidence)
                    : Math.floor(Math.random() * 20) + 75
            };
        }

        function showControlledSignal(signal, countStats = true) {
            const normalized = normalizeSignal(signal);
            if (!normalized) return false;

            showSignal(normalized, true);

            if (countStats) {
                stats.total += 1;
                if (normalized.imageKey === 'red' || normalized.imageKey === 'yellow') {
                    stats.bonusHits += 1;
                }
                stats.accuracy = Math.min(98, Math.max(85,
                    stats.accuracy + (Math.random() > 0.6 ? 1 : -1)
                ));
                updateStats();
            }
            return true;
        }

        // Returns ONE signal only. Nothing is shown until this function is called.
        function getNextSignalForClick() {
            if (!liveControl.enabled) return null;

            // Admin Manual Single: always show the currently selected signal.
            if (liveControl.mode === 'single') {
                return {
                    imageKey: liveControl.selectedSignal,
                    name: signalTypes[liveControl.selectedSignal]?.label
                };
            }

            // Admin Manual Multiple / sequence: advance exactly one item per click.
            if (liveControl.mode === 'sequence') {
                const list = Array.isArray(liveControl.sequence)
                    ? liveControl.sequence.filter(key => !!fishImages[key])
                    : [];

                if (!list.length) return null;

                if (sequenceIndex >= list.length) sequenceIndex = 0;
                const key = list[sequenceIndex];
                sequenceIndex = (sequenceIndex + 1) % list.length;

                return {
                    imageKey: key,
                    name: signalTypes[key]?.label
                };
            }

            // Random mode: generate only when the user clicks Get Signal.
            return randomSignal();
        }

        function subscribeToLiveSignalControl() {
            if (controlUnsubscribe) controlUnsubscribe();

            controlUnsubscribe = db.collection('settings')
                .doc('liveSignalControl')
                .onSnapshot((doc) => {
                    if (!doc.exists) {
                        liveControl = {
                            enabled: true,
                            mode: 'random',
                            selectedSignal: 'blue',
                            sequence: [],
                            version: 0
                        };
                        sequenceIndex = 0;
                        return;
                    }

                    const data = doc.data() || {};
                    const nextMode = ['random', 'single', 'sequence'].includes(data.mode)
                        ? data.mode : 'random';
                    const nextSelected = fishImages[data.selectedSignal]
                        ? data.selectedSignal : 'blue';
                    const nextSequence = Array.isArray(data.sequence)
                        ? data.sequence.filter(key => !!fishImages[key]) : [];

                    // Admin changes are received silently. They NEVER render
                    // a new signal and NEVER change the current visible signal.
                    // Only Get Signal may advance/show a prediction.
                    const oldMode = liveControl.mode;
                    const oldSequence = Array.isArray(liveControl.sequence) ? liveControl.sequence : [];
                    const sequenceChanged =
                        oldMode !== nextMode ||
                        oldSequence.length !== nextSequence.length ||
                        oldSequence.some((v, i) => v !== nextSequence[i]);

                    liveControl = {
                        enabled: data.enabled !== false,
                        mode: nextMode,
                        selectedSignal: nextSelected,
                        sequence: nextSequence,
                        version: Number(data.version || 0)
                    };

                    // A newly selected/changed queue starts from item 1,
                    // but it is NOT displayed until Get Signal is clicked.
                    if (nextMode !== 'sequence' || sequenceChanged) {
                        sequenceIndex = 0;
                    }
                }, (error) => {
                    console.error('Live signal control listener error:', error);
                });
        }

        async function getSignal() {
            // Prevent double/triple taps from changing multiple signals at once.
            if (predictionBusy) return;
            predictionBusy = true;

            const oldText = predictBtn.innerHTML;
            predictBtn.disabled = true;
            predictBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Getting Signal...';

            try {
                const signal = getNextSignalForClick();

                if (!signal) {
                    showNoSignal();
                    return;
                }

                // Render exactly ONE signal for this click.
                showControlledSignal(signal, true);
            } finally {
                // Keep the lock only long enough to stop accidental multi-clicks.
                setTimeout(() => {
                    predictionBusy = false;
                    predictBtn.disabled = false;
                    predictBtn.innerHTML = oldText;
                }, 350);
            }
        }

        // Refresh does not generate a new signal. Get Signal is the only
        // action that changes the prediction.
        function refreshSignal() {
            // Refresh only re-reads admin settings. It never generates
            // or displays a new signal.
            subscribeToLiveSignalControl();
        }

        // ============================================================
        // AUTH CHECK
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                updateStats();
                subscribeToLiveSignalControl();
            } else {
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        predictBtn.addEventListener('click', getSignal);
        refreshBtn.addEventListener('click', refreshSignal);

        // ============================================================
        // INIT
        // ============================================================
        updateStats();
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ICE FISHING | Live Signals</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg: #0a0e17;
            --card: #111827;
            --card-hover: #1a2332;
            --border: #1e2a3a;
            --input: #0d1420;
            --blue: #3b82f6;
            --blue-dark: #1d4ed8;
            --text: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #4a5a7a;
            --gold: #fbbf24;
            --green: #34d399;
            --red: #f87171;
            --orange: #fb923c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            background: rgba(59,130,246,0.08);
            border: none;
            color: var(--blue);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(59,130,246,0.15);
        }
        .header h1 {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .header h1 span {
            color: var(--blue);
        }
        .header-status {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--green);
            background: rgba(52,211,153,0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(52,211,153,0.15);
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
            padding: 16px 16px 100px;
        }

        .hero {
            text-align: center;
            padding: 18px 0 12px;
        }
        .hero h2 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .hero h2 span {
            color: var(--blue);
        }
        .hero p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
        }

        .signal-card-main {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px 20px 20px;
            margin: 16px 0;
            transition: all 0.3s;
        }

        .signal-card-main .label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 16px;
        }
        .signal-card-main .label i {
            color: var(--blue);
            margin-right: 6px;
        }

        .placeholder-box {
            text-align: center;
            padding: 30px 20px;
        }
        .placeholder-box i {
            font-size: 42px;
            color: var(--text-muted);
            opacity: 0.3;
            margin-bottom: 12px;
        }
        .placeholder-box .main-text {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-secondary);
        }
        .placeholder-box .sub-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .signal-display {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .signal-display.active {
            display: flex;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(8px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .signal-display .signal-image {
            width: 200px;
            height: 100px;
            object-fit: contain;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            padding: 8px;
        }

        .signal-display .signal-name {
            font-size: 26px;
            font-weight: 800;
            margin-top: 12px;
            letter-spacing: -0.5px;
        }

        .signal-display .signal-type-badge {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 14px;
            border-radius: 20px;
            margin-top: 6px;
        }

        .signal-display .signal-type-badge.red {
            background: rgba(248,113,113,0.12);
            color: var(--red);
            border: 1px solid rgba(248,113,113,0.1);
        }
        .signal-display .signal-type-badge.orange {
            background: rgba(251,146,60,0.12);
            color: var(--orange);
            border: 1px solid rgba(251,146,60,0.1);
        }
        .signal-display .signal-type-badge.blue {
            background: rgba(59,130,246,0.12);
            color: var(--blue);
            border: 1px solid rgba(59,130,246,0.1);
        }

        .confidence-section {
            margin-top: 16px;
            width: 100%;
        }
        .confidence-section .top {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .confidence-section .top .label {
            font-weight: 400;
        }
        .confidence-section .top .value {
            font-weight: 700;
        }
        .confidence-bar {
            width: 100%;
            height: 4px;
            background: var(--input);
            border-radius: 10px;
            overflow: hidden;
        }
        .confidence-bar .fill {
            height: 100%;
            background: linear-gradient(90deg, var(--blue), var(--blue-dark));
            width: 0%;
            transition: width 1s ease;
            border-radius: 10px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin: 16px 0;
        }
        .btn {
            flex: 1;
            padding: 14px 12px;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--blue), var(--blue-dark));
            color: #fff;
            box-shadow: 0 4px 20px rgba(59,130,246,0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(59,130,246,0.35);
        }
        .btn-primary:active {
            transform: translateY(0);
        }
        .btn-secondary {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-secondary:hover {
            background: var(--card-hover);
            border-color: var(--text-muted);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 14px 12px;
            margin-top: 4px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text);
            letter-spacing: -0.3px;
        }
        .stat-item .label {
            font-size: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59,130,246,0.1);
            border-top: 3px solid var(--blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            .container { padding: 12px; }
            .signal-card-main { padding: 18px 16px; }
            .signal-display .signal-image { width: 160px; height: 80px; }
            .signal-display .signal-name { font-size: 20px; }
            .stats-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 10px 8px; }
            .stat-item .value { font-size: 15px; }
            .btn { font-size: 10px; padding: 12px 8px; }
        }

        @media (max-width: 380px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-left">
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i></button>
            <h1>🎣 <span>ICE FISHING</span></h1>
        </div>
        <span class="header-status"><i class="fas fa-circle" style="font-size:6px;margin-right:4px;"></i> LIVE</span>
    </div>

    <div class="container">

        <div class="hero">
            <h2><span>Live</span> Predictions</h2>
            <p>Real-time signals powered by AI</p>
        </div>

        <div class="signal-card-main">
            <div class="label"><i class="fas fa-bolt"></i> Current Signal</div>

            <div id="placeholderBox" class="placeholder-box">
                <i class="fas fa-wave-square"></i>
                <div class="main-text">Loading signal...</div>
                <div class="sub-text">Please wait</div>
            </div>

            <div id="signalDisplay" class="signal-display">
                <img id="signalImage" class="signal-image" src="" alt="Signal">
                <div class="signal-name" id="signalName">—</div>
                <span class="signal-type-badge" id="signalBadge">—</span>

                <div class="confidence-section">
                    <div class="top">
                        <span class="label">AI Confidence</span>
                        <span class="value" id="confidenceValue">0%</span>
                    </div>
                    <div class="confidence-bar">
                        <div class="fill" id="confidenceFill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="predictBtn">
                <i class="fas fa-magic"></i> Get Signal
            </button>
            <button class="btn btn-secondary" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <div class="value" id="totalPredictions">0</div>
                <div class="label">Total</div>
            </div>
            <div class="stat-item">
                <div class="value" id="accuracy">0%</div>
                <div class="label">Accuracy</div>
            </div>
            <div class="stat-item">
                <div class="value" id="bonusHits">0</div>
                <div class="label">Bonus</div>
            </div>
            <div class="stat-item">
                <div class="value" id="liveUsers">0</div>
                <div class="label">Live</div>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>

    <script>
        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // CLOUDINARY IMAGES
        // ============================================================
        const fishImages = {
            'red': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040428/fish-red_g9jmt4.png',
            'yellow': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040428/fish-yellow_zkxguo.png',
            'blue': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040428/fish-blue_niavh5.png',
            'darkleaf': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040427/Compressed_DARK_LEAF_2_2_intxk4.png',
            'whiteleaf': 'https://res.cloudinary.com/dw72p48ir/image/upload/v1788040428/Compressed_white_leaf_wif8c8.png'
        };

        const signalTypes = {
            'red': { label: 'Huge Reds', badge: 'red', color: '#f87171' },
            'yellow': { label: 'Big Orange', badge: 'orange', color: '#fb923c' },
            'blue': { label: 'Lil Blues', badge: 'blue', color: '#3b82f6' },
            'darkleaf': { label: 'Dark Leaf', badge: 'orange', color: '#fb923c' },
            'whiteleaf': { label: 'White Leaf', badge: 'blue', color: '#3b82f6' }
        };

        // ============================================================
        // STATE
        // ============================================================
        let currentUser = null;
        let stats = { total: 1249, accuracy: 94, bonusHits: 128, liveUsers: 1247 };
        let isListening = false;
        let unsubscribeSignals = null;

        // ============================================================
        // DOM REFS
        // ============================================================
        const placeholderBox = document.getElementById('placeholderBox');
        const signalDisplay = document.getElementById('signalDisplay');
        const signalImage = document.getElementById('signalImage');
        const signalName = document.getElementById('signalName');
        const signalBadge = document.getElementById('signalBadge');
        const confidenceValue = document.getElementById('confidenceValue');
        const confidenceFill = document.getElementById('confidenceFill');
        const predictBtn = document.getElementById('predictBtn');
        const refreshBtn = document.getElementById('refreshBtn');

        // ============================================================
        // FUNCTIONS
        // ============================================================
        function goBack() {
            window.location.href = 'dashboard.html';
        }

        function showLoading() {
            placeholderBox.innerHTML = `
                <div class="loading-spinner"></div>
                <div class="loading-text">Analyzing patterns...</div>
            `;
            placeholderBox.style.display = 'block';
            signalDisplay.classList.remove('active');
            signalDisplay.style.display = 'none';
        }

        function showSignal(signal) {
            const imageUrl = fishImages[signal.imageKey] || fishImages['blue'];
            const typeInfo = signalTypes[signal.imageKey] || signalTypes['blue'];

            signalImage.src = imageUrl;
            signalImage.alt = signal.name;

            signalName.textContent = signal.name;
            signalName.style.color = typeInfo.color;

            signalBadge.textContent = typeInfo.label;
            signalBadge.className = 'signal-type-badge ' + typeInfo.badge;

            const confidence = signal.confidence || Math.floor(Math.random() * 20) + 75;
            confidenceValue.textContent = confidence + '%';
            confidenceFill.style.width = confidence + '%';

            placeholderBox.style.display = 'none';
            signalDisplay.style.display = 'flex';
            signalDisplay.classList.add('active');
        }

        function showDefaultSignal() {
            const keys = ['red', 'yellow', 'blue', 'darkleaf', 'whiteleaf'];
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const typeInfo = signalTypes[randomKey];
            showSignal({
                name: typeInfo.label,
                imageKey: randomKey,
                confidence: Math.floor(Math.random() * 20) + 75
            });
        }

        function showNoSignal() {
            placeholderBox.innerHTML = `
                <i class="fas fa-wave-square"></i>
                <div class="main-text">Ready for signal</div>
                <div class="sub-text">Click "Get Signal" to start</div>
            `;
            placeholderBox.style.display = 'block';
            signalDisplay.classList.remove('active');
            signalDisplay.style.display = 'none';
        }

        function updateStats() {
            document.getElementById('totalPredictions').textContent = stats.total.toLocaleString();
            document.getElementById('accuracy').textContent = stats.accuracy + '%';
            document.getElementById('bonusHits').textContent = stats.bonusHits;
            document.getElementById('liveUsers').textContent = (stats.liveUsers / 1000).toFixed(1) + 'k';
        }

        // ============================================================
        // GET SIGNAL FROM FIREBASE OR FALLBACK
        // ============================================================
        function getSignal() {
            showLoading();

            // Try to get signal from Firebase
            db.collection('liveSignals')
                .orderBy('createdAt', 'desc')
                .limit(1)
                .get()
                .then((snapshot) => {
                    if (!snapshot.empty) {
                        const doc = snapshot.docs[0];
                        const data = doc.data();
                        showSignal({
                            name: data.name || 'Signal',
                            imageKey: data.imageKey || 'blue',
                            confidence: data.confidence || 75
                        });
                        stats.total += 1;
                        if (data.imageKey === 'red' || data.imageKey === 'yellow') {
                            stats.bonusHits += 1;
                        }
                        stats.accuracy = Math.min(98, Math.max(85, stats.accuracy + (Math.random() > 0.6 ? 1 : -1)));
                        stats.liveUsers = Math.max(800, stats.liveUsers + Math.floor(Math.random() * 20) - 10);
                        updateStats();
                    } else {
                        // No signal in Firebase, show default/random
                        showDefaultSignal();
                        stats.total += 1;
                        stats.accuracy = Math.min(98, Math.max(85, stats.accuracy + (Math.random() > 0.6 ? 1 : -1)));
                        updateStats();
                    }
                })
                .catch((error) => {
                    console.error('Error getting signal:', error);
                    // If Firebase fails, show default signal
                    showDefaultSignal();
                    stats.total += 1;
                    updateStats();
                });
        }

        // ============================================================
        // REFRESH
        // ============================================================
        function refreshSignal() {
            placeholderBox.innerHTML = `
                <i class="fas fa-wave-square"></i>
                <div class="main-text">Refreshing...</div>
                <div class="sub-text">Please wait</div>
            `;
            placeholderBox.style.display = 'block';
            signalDisplay.classList.remove('active');
            signalDisplay.style.display = 'none';
            setTimeout(() => getSignal(), 500);
        }

        // ============================================================
        // AUTH CHECK
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                // Show default signal immediately
                setTimeout(() => {
                    showDefaultSignal();
                    updateStats();
                }, 500);
            } else {
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        // EVENT LISTENERS
        // ============================================================
        predictBtn.addEventListener('click', getSignal);
        refreshBtn.addEventListener('click', refreshSignal);

        // ============================================================
        // INIT
        // ============================================================
        updateStats();

        // Live users random update
        setInterval(() => {
            stats.liveUsers = Math.max(800, stats.liveUsers + Math.floor(Math.random() * 30) - 15);
            updateStats();
        }, 10000);
    </script>

</body>
</html>

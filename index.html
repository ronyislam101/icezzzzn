<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07111f">
<title>ICE FISHING</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#050b14;color:#eef7ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow-x:hidden}
button,input{font:inherit}
button{border:0}
.app{min-height:100dvh;position:relative;display:flex;flex-direction:column;overflow:hidden;background:
 radial-gradient(700px 420px at 50% -10%,rgba(70,170,255,.17),transparent 65%),
 linear-gradient(180deg,#081321 0%,#050b14 55%,#03070d 100%)}
.app:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:34px 34px}
.topbar{position:relative;z-index:2;padding:calc(18px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between}
.brand-mini{display:flex;align-items:center;gap:11px}
.brand-dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#0b1c2e;border:1px solid rgba(132,205,255,.2);box-shadow:0 8px 24px rgba(0,0,0,.28);overflow:hidden}
.brand-dot img{width:100%;height:100%;object-fit:contain}
.brand-dot span{display:none;font-weight:800;font-size:13px}
.brand-name{font-size:13px;letter-spacing:2.2px;font-weight:800;color:#b9d8ef}
.status{display:flex;align-items:center;gap:7px;padding:8px 11px;border:1px solid rgba(133,205,255,.14);background:rgba(11,28,46,.7);border-radius:999px;font-size:10px;font-weight:800;letter-spacing:1.2px;color:#87b5d7}
.status i{width:6px;height:6px;border-radius:50%;background:#55d6ff;box-shadow:0 0 10px #55d6ff}
.main{position:relative;z-index:1;width:100%;max-width:440px;margin:auto;padding:24px 20px 18px;display:flex;flex-direction:column;justify-content:center;flex:1}
.hero{text-align:center;margin-bottom:28px}
.logo-wrap{width:88px;height:88px;margin:0 auto 20px;border-radius:26px;padding:8px;background:linear-gradient(145deg,rgba(91,193,255,.18),rgba(7,18,31,.95));border:1px solid rgba(133,211,255,.22);box-shadow:0 20px 50px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.08);overflow:hidden}
.logo-wrap img{width:116%;height:116%;margin:-8%;object-fit:cover;display:block}
.logo-fallback{display:none;width:100%;height:100%;align-items:center;justify-content:center;font-weight:950;font-size:20px;letter-spacing:-1px;color:#dff5ff}
.hero h1{margin:0;font-size:30px;line-height:1.05;letter-spacing:4px;font-weight:900;color:#f5fbff}
.hero p{margin:10px 0 0;color:#7391a9;font-size:12px;letter-spacing:1.5px;font-weight:700}
.card{background:linear-gradient(145deg,rgba(14,31,49,.94),rgba(7,15,26,.96));border:1px solid rgba(133,207,255,.13);border-radius:25px;padding:20px;box-shadow:0 25px 70px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.035)}
.label{display:flex;justify-content:space-between;align-items:center;margin:0 2px 9px;color:#86a4bb;font-size:10px;font-weight:850;letter-spacing:1.4px;text-transform:uppercase}
.input-box{height:58px;display:flex;align-items:center;gap:9px;padding:5px 6px 5px 16px;border-radius:16px;background:#050c16;border:1px solid rgba(132,204,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}
.input-box:focus-within{border-color:rgba(84,196,255,.5);box-shadow:0 0 0 3px rgba(84,196,255,.08)}
.input-box input{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;color:#eef9ff;font-size:15px;font-weight:750;letter-spacing:2px;text-transform:uppercase}
.input-box input::placeholder{color:#41596e;letter-spacing:1px;font-size:12px}
.paste{height:44px;min-width:66px;padding:0 13px;border-radius:12px;background:#112b42;border:1px solid rgba(91,199,255,.18);color:#8edaff;font-size:10px;font-weight:900;letter-spacing:1px}
.paste:active{transform:scale(.97)}
.primary{width:100%;height:58px;margin-top:13px;border-radius:16px;background:linear-gradient(135deg,#5ad4ff,#2d9ee7);color:#03101b;font-size:13px;font-weight:950;letter-spacing:1.7px;box-shadow:0 13px 28px rgba(43,164,231,.22)}
.primary:active{transform:translateY(1px) scale(.99)}
.primary:disabled{opacity:.45;box-shadow:none}
.message{min-height:20px;margin:10px 4px 0;text-align:center;color:#7792a8;font-size:11px;line-height:1.4}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:13px}
.action{display:flex;align-items:center;justify-content:center;text-decoration:none;height:48px;border-radius:14px;background:#091624;border:1px solid rgba(127,193,231,.1);color:#a8c4d9;font-size:11px;font-weight:850;letter-spacing:.7px}
.action:active{transform:scale(.98);background:#0d2032}
.support{display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%;margin-top:10px;height:45px;border-radius:14px;background:transparent;color:#63839b;font-size:10px;font-weight:800;letter-spacing:1.1px}
.bottom{position:relative;z-index:1;text-align:center;padding:10px 20px calc(18px + env(safe-area-inset-bottom));color:#385268;font-size:9px;letter-spacing:1.5px;font-weight:750}
.bottom b{color:#54738a}
#resetBox,#forceUpdateOverlay{z-index:99}
@media(min-height:760px){.main{padding-top:40px;padding-bottom:30px}.hero{margin-bottom:32px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand-mini">
      <div class="brand-dot">
        <img src="https://raw.githubusercontent.com/ronyislam101/icezzzzn/main/assets/logo/logo.png" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
        <span>IF</span>
      </div>
      <div class="brand-name">ICE FISHING</div>
    </div>
    <div class="status"><i></i> SECURE ACCESS</div>
  </div>

  <main class="main">
    <section class="hero">
      <div class="logo-wrap">
        <img src="https://raw.githubusercontent.com/ronyislam101/icezzzzn/main/assets/logo/logo.png" alt="ICE FISHING" onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex'">
        <div id="logoFallback" class="logo-fallback">IF</div>
      </div>
      <h1>ICE FISHING</h1>
      <p>LICENSED ACCESS PORTAL</p>
    </section>

    <section class="card">
      <div class="label"><span>License Key</span><span>16 Characters</span></div>
      <div class="input-box">
        <input id="licenseKey" name="licenseKey" type="text" maxlength="19" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX">
        <button id="pasteBtn" class="paste" type="button">PASTE</button>
      </div>
      <button id="loginBtn" class="primary" type="button">ACTIVATE &amp; CONTINUE</button>
      <div id="message" class="message"></div>
      <div class="actions">
        <a id="buyBtn" class="action" href="packages.html?from=login">BUY PACKAGE</a>
        <a id="historyBtn" class="action" href="transaction.html">TRANSACTION HISTORY</a>
      </div>
      <a id="supportBtn" class="support" href="https://t.me/+KjcGu4IKIMFlMzg9" target="_blank" rel="noopener">CONTACT SUPPORT</a>
    </section>
  </main>

  <div class="bottom">ICE FISHING <b>•</b> PREMIUM ACCESS</div>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>
<script>
        // ============================================================
        // PARTICLES
        // ============================================================
        (function createParticles() {
            const container = document.getElementById('particles');
            const iceEmojis = ['❄️', '✦', '❄️', '✦', '❄️'];
            const fishEmojis = ['🐟', '🐠', '🐡'];

            for (let i = 0; i < 25; i++) {
                const el = document.createElement('div');
                const isFish = Math.random() < 0.35;
                el.className = 'particle ' + (isFish ? 'fish' : 'ice');
                el.textContent = isFish ?
                    fishEmojis[Math.floor(Math.random() * fishEmojis.length)] :
                    iceEmojis[Math.floor(Math.random() * iceEmojis.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 0.8 + 0.6) + 'rem';
                el.style.opacity = Math.random() * 0.04 + 0.02;
                el.style.animationDuration = (Math.random() * 18 + 12) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(el);
            }
        })();

        // ============================================================
        // FIREBASE CONFIG
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8",
            databaseURL: "https://ice-fishing-c20bc-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const fsdb = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const form = document.getElementById('loginForm');
        const keyInput = document.getElementById('licenseKey');
        const msg = document.getElementById('message');
        const msgText = document.getElementById('message');
        const loginBtn = document.getElementById('loginBtn');
        const btnLabel = document.getElementById('btnLabel');
        const spinner = document.getElementById('spinner');
        const pasteBtn = document.getElementById('pasteBtn');

        // APK/WebView friendly clipboard paste. Native Android wrappers can expose
        // window.Android.getClipboard(); browser fallback uses the Clipboard API.
        async function pasteLicenseKey(){
            if(forceUpdateActive) return;
            try{
                let text = '';
                if(window.Android && typeof window.Android.getClipboard === 'function'){
                    text = String(window.Android.getClipboard() || '');
                } else if(navigator.clipboard && navigator.clipboard.readText){
                    text = await navigator.clipboard.readText();
                } else {
                    throw new Error('Clipboard access is not available in this APK.');
                }
                text = text.trim().replace(/\s+/g,'').replace(/[^a-zA-Z0-9-]/g,'').toUpperCase();
                if(!text){ showMsg('Clipboard is empty.', 'error'); return; }
                keyInput.value = text;
                keyInput.dispatchEvent(new Event('input',{bubbles:true}));
                keyInput.focus();
                checkResetAvailability();
            }catch(e){
                showMsg('Paste permission/access is not available. Please allow clipboard access or paste manually.', 'error');
            }
        }
        pasteBtn.addEventListener('click', pasteLicenseKey);


        // ============================================================
        // FORCE UPDATE CONTROL
        // Admin controls settings/appUpdate.enabled from the admin panel.
        // When enabled, the login page is fully locked until Update Now is clicked.
        // ============================================================
        const UPDATE_URL = 'https://t.me/+aqSF_M2LTRQyNWVl';
        let forceUpdateActive = false;
        let resetCheckTimer = null;
        let currentResetKey = '';

        function lockForUpdate(data) {
            forceUpdateActive = true;
            document.body.classList.add('force-locked');
            const overlay = document.getElementById('forceUpdateOverlay');
            const title = document.getElementById('forceUpdateTitle');
            const text = document.getElementById('forceUpdateText');
            const btn = document.getElementById('forceUpdateBtn');
            title.textContent = data.title || 'Update Required';
            text.textContent = data.message || 'A new version of ICE FISHING is required. Please update now to continue.';
            btn.onclick = function(){ window.location.href = data.updateUrl || UPDATE_URL; };
            overlay.classList.add('show');
            if (form) form.querySelectorAll('input,button').forEach(el => el.disabled = true);
        }

        function unlockFromUpdate() {
            forceUpdateActive = false;
            document.body.classList.remove('force-locked');
            document.getElementById('forceUpdateOverlay').classList.remove('show');
            if (form) form.querySelectorAll('input,button').forEach(el => el.disabled = false);
        }

        function watchForceUpdate() {
            try {
                fsdb.collection('settings').doc('appUpdate').onSnapshot((snap) => {
                    const data = snap.exists ? (snap.data() || {}) : {};
                    if (data.enabled === true) lockForUpdate(data);
                    else if (forceUpdateActive) unlockFromUpdate();
                }, (err) => console.warn('Force update setting read failed:', err));
            } catch (e) { console.warn('Force update watcher failed:', e); }
        }

        // ============================================================
        // LICENSE RESET REQUEST
        // ============================================================
        function cleanLicenseForReset(value) {
            return String(value || '').replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
        }

        function showResetBox(show, pending=false) {
            const box = document.getElementById('resetBox');
            const btn = document.getElementById('resetRequestBtn');
            const pendingEl = document.getElementById('resetPending');
            if (!show) { box.classList.remove('show'); return; }
            box.classList.add('show');
            btn.style.display = pending ? 'none' : 'block';
            pendingEl.style.display = pending ? 'block' : 'none';
        }

        async function checkResetAvailability() {
            if (forceUpdateActive) return;
            const cleanKey = cleanLicenseForReset(keyInput.value);
            currentResetKey = cleanKey;
            if (cleanKey.length !== 16) { showResetBox(false); return; }
            try {
                const snap = await db.ref('userKeys/' + cleanKey).once('value');
                const data = snap.val() || {};
                if (Number(data.loginCount || 0) < Number(data.maxLogins || 3)) { showResetBox(false); return; }
                const reqSnap = await db.ref('licenseResetRequests/' + cleanKey).once('value');
                const req = reqSnap.val() || {};
                showResetBox(true, String(req.status || '').toLowerCase() === 'pending');
            } catch (e) { console.warn('Reset availability check failed:', e); }
        }

        async function requestLicenseReset() {
            if (forceUpdateActive) return;
            const cleanKey = cleanLicenseForReset(keyInput.value);
            if (cleanKey.length !== 16) return;
            currentResetKey = cleanKey;
            const btn = document.getElementById('resetRequestBtn');
            btn.disabled = true;
            btn.textContent = 'Sending Request...';
            try {
                const keySnap = await db.ref('userKeys/' + cleanKey).once('value');
                const keyData = keySnap.val() || {};
                const count = Number(keyData.loginCount || 0);
                const max = Number(keyData.maxLogins || 3);
                if (count < max) { showResetBox(false); return; }

                const requestRef = db.ref('licenseResetRequests/' + cleanKey);
                const existing = (await requestRef.once('value')).val() || {};
                if (String(existing.status || '').toLowerCase() === 'pending') {
                    showResetBox(true, true); return;
                }
                await requestRef.set({
                    licenseKey: keyData.key || cleanKey,
                    cleanKey: cleanKey,
                    userName: keyData.userName || 'Unknown',
                    loginCount: count,
                    maxLogins: max,
                    status: 'pending',
                    requestedAt: firebase.database.ServerValue.TIMESTAMP,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });
                showMsg('✅ Reset request sent to admin. Please wait for approval.', 'success');
                showResetBox(true, true);
            } catch (e) {
                console.error('Reset request failed:', e);
                showMsg('❌ Could not send reset request: ' + e.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Request Reset';
            }
        }

        keyInput.addEventListener('input', function(){
            clearTimeout(resetCheckTimer);
            resetCheckTimer = setTimeout(checkResetAvailability, 250);
        });

        // ============================================================
        // AUTO-FORMAT KEY
        // ============================================================
        keyInput.addEventListener('input', function(e) {
            let value = this.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
            let formatted = '';
            for (let i = 0; i < value.length && i < 16; i++) {
                if (i > 0 && i % 4 === 0) formatted += '-';
                formatted += value[i];
            }
            this.value = formatted;
        });

        keyInput.focus();
        watchForceUpdate();

        // ============================================================
        // MESSAGE FUNCTIONS
        // ============================================================
        function showMsg(text, type) {
            if (msgText) msgText.textContent = text;
            msg.className = 'message ' + type;
            console.log('📢 Message:', text, 'Type:', type);
        }

        function hideMsg() {
            msg.className = 'message';
        }

        function setLoading(loading) {
            loginBtn.disabled = loading;
            if (spinner) spinner.classList.toggle('hidden', !loading);
            if (btnLabel) btnLabel.textContent = loading ? 'Verifying...' : 'Activate License';
        }

        // ============================================================
        // HANDLE LOGIN - DIRECT REALTIME DATABASE CHECK
        // ============================================================
        async function handleLogin(e) {
            e.preventDefault();
            hideMsg();

            const key = keyInput.value.trim().toUpperCase();
            console.log('🔑 Login attempt with key:', key);

            if (!key || key.length < 19) {
                showMsg('⚠️ Please enter a valid license key (format: XXXX-XXXX-XXXX-XXXX).', 'error');
                keyInput.focus();
                return;
            }

            setLoading(true);

            try {
                const cleanKey = key.replace(/-/g, '');
                console.log('🔍 Searching for clean key:', cleanKey);

                // ============================================================
                // STEP 1: Check in Realtime Database
                // ============================================================
                const snapshot = await db.ref('userKeys/' + cleanKey).once('value');
                const keyData = snapshot.val();

                console.log('📦 Key data from Realtime DB:', keyData);

                if (!keyData) {
                    showMsg('❌ Invalid license key. Please check and try again.', 'error');
                    setLoading(false);
                    keyInput.value = '';
                    keyInput.focus();
                    return;
                }

                // Each license key can be used on up to 3 devices/logins.
                // Older records may still have isUsed=true from the previous
                // one-time-login logic, so loginCount is the source of truth.
                const loginCount = Number(keyData.loginCount || 0);
                if (loginCount >= 3) {
                    showMsg('❌ This license key has reached its 3-device login limit. You can request a reset below.', 'error');
                    setLoading(false);
                    showResetBox(true, false);
                    checkResetAvailability();
                    return;
                }

                if (keyData.isBanned) {
                    showMsg('❌ This license key is banned. Contact support.', 'error');
                    setLoading(false);
                    keyInput.value = '';
                    keyInput.focus();
                    return;
                }

                if (keyData.expiryDate) {
                    const expiry = new Date(keyData.expiryDate);
                    if (expiry < new Date()) {
                        showMsg('❌ License key has expired. Contact support.', 'error');
                        setLoading(false);
                        return;
                    }
                }

                // ============================================================
                // STEP 2: Create/Login user with Email/Password
                // ============================================================
                // The license key itself is NOT an email/password.
                // We use a deterministic Firebase Auth account for each key.
                const email = cleanKey + '@icefishing.com';
                const password = 'IceFishing@2026#' + cleanKey;

                let userCredential;

                try {
                    // First attempt to create the Auth account.
                    // This is important for a newly generated license key.
                    userCredential = await auth.createUserWithEmailAndPassword(
                        email,
                        password
                    );

                    console.log('✅ New Firebase Auth account created:', userCredential.user.uid);

                } catch (createError) {
                    console.log('ℹ️ Create account result:', createError.code);

                    if (createError.code === 'auth/email-already-in-use') {
                        // Existing account: sign in using the same deterministic credentials.
                        try {
                            userCredential = await auth.signInWithEmailAndPassword(
                                email,
                                password
                            );

                            console.log('✅ Existing Firebase Auth account logged in:', userCredential.user.uid);

                        } catch (loginError) {
                            console.error('❌ Firebase login error:', loginError);

                            let authMsg = 'Firebase authentication failed.';

                            if (
                                loginError.code === 'auth/invalid-credential' ||
                                loginError.code === 'auth/invalid-login-credentials' ||
                                loginError.code === 'auth/wrong-password'
                            ) {
                                authMsg =
                                    'This license already has a different Firebase password. ' +
                                    'Generate a new license key or reset its Firebase Auth account.';
                            } else if (loginError.code === 'auth/user-disabled') {
                                authMsg = 'This Firebase account has been disabled.';
                            } else if (loginError.code === 'auth/too-many-requests') {
                                authMsg = 'Too many authentication attempts. Please try again later.';
                            } else if (loginError.message) {
                                authMsg = loginError.message;
                            }

                            showMsg('❌ ' + authMsg, 'error');
                            setLoading(false);
                            return;
                        }
                    } else if (createError.code === 'auth/operation-not-allowed') {
                        showMsg(
                            '❌ Firebase Email/Password authentication is disabled. Enable it in Firebase Console.',
                            'error'
                        );
                        setLoading(false);
                        return;
                    } else if (createError.code === 'auth/weak-password') {
                        showMsg('❌ Firebase rejected the password configuration.', 'error');
                        setLoading(false);
                        return;
                    } else if (createError.code === 'auth/invalid-email') {
                        showMsg('❌ Invalid Firebase email generated from this license key.', 'error');
                        setLoading(false);
                        return;
                    } else {
                        console.error('❌ Firebase account creation error:', createError);
                        showMsg(
                            '❌ Authentication failed: ' + (createError.message || 'Unknown error.'),
                            'error'
                        );
                        setLoading(false);
                        return;
                    }
                }

                const user = userCredential.user;

                if (!user || !user.uid) {
                    showMsg('❌ Firebase did not return a valid user account.', 'error');
                    setLoading(false);
                    return;
                }

                console.log('✅ Authenticated UID:', user.uid);

                // ============================================================
                // STEP 3: Update key as used
                // ============================================================
                const nextLoginCount = loginCount + 1;
                await db.ref('userKeys/' + cleanKey).update({
                    isUsed: nextLoginCount >= 3,
                    usedBy: user.uid,
                    loginCount: nextLoginCount,
                    usedAt: firebase.database.ServerValue.TIMESTAMP,
                    updatedAt: firebase.database.ServerValue.TIMESTAMP
                });

                // ============================================================
                // STEP 4: Save user data
                // ============================================================
                await db.ref('users/' + user.uid).set({
                    uid: user.uid,
                    userKey: cleanKey,
                    name: keyData.userName || 'Player',
                    phone: keyData.userPhone || '',
                    packageName: keyData.packageName || 'Starter',
                    packagePrice: keyData.packagePrice || 0,
                    packageDuration: keyData.packageDuration || '1 Hour',
                    packageExpiry: keyData.expiryDate || null,
                    isActive: true,
                    isBlocked: false,
                    walletBalance: 0,
                    totalFish: 0,
                    totalScore: 0,
                    coins: 0,
                    createdAt: firebase.database.ServerValue.TIMESTAMP,
                    lastLogin: firebase.database.ServerValue.TIMESTAMP
                });

                showMsg('✅ Welcome to ICE FISHING! Redirecting...', 'success');
                setLoading(false);

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('❌ Login Error:', error);
                let errorMsg = 'Login failed. Please try again.';
                if (error.code === 'auth/email-already-in-use') errorMsg = 'Account already exists. Please contact support.';
                else if (error.code === 'auth/weak-password') errorMsg = 'Password is too weak.';
                else if (
                    error.code === 'auth/invalid-credential' ||
                    error.code === 'auth/invalid-login-credentials' ||
                    error.code === 'auth/wrong-password'
                ) errorMsg = 'Invalid Firebase credentials for this license key. Generate a new key or reset the Auth account.';
                else if (error.code === 'auth/too-many-requests') errorMsg = 'Too many attempts. Try again later.';
                else if (error.code === 'auth/operation-not-allowed') errorMsg = 'Email/Password sign-in not enabled. Contact admin.';
                else if (error.message) errorMsg = error.message;
                showMsg('❌ ' + errorMsg, 'error');
                setLoading(false);
            }
        }

        if (form) form.addEventListener('submit', handleLogin);
        loginBtn.addEventListener('click', handleLogin);
        keyInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin(e);
            }
        });
        keyInput.addEventListener('focus', hideMsg);

        console.log('🔥 User Login Ready');
        console.log('📁 Database URL:', firebaseConfig.databaseURL);
    </script>

<script>
(function(){
  const btn=document.getElementById('pasteBtn');
  const input=document.getElementById('licenseKey');
  if(!btn||!input)return;
  function put(v){
    v=(v||'').toString().trim();
    if(!v)return false;
    input.value=v;
    input.dispatchEvent(new Event('input',{bubbles:true}));
    input.dispatchEvent(new Event('change',{bubbles:true}));
    input.focus();
    return true;
  }
  btn.addEventListener('click',async function(){
    try{
      if(window.Android){
        const fns=['getClipboardText','pasteFromClipboard','readClipboard'];
        for(const n of fns){
          if(typeof window.Android[n]==='function'){
            const v=window.Android[n]();
            if(v&&typeof v.then==='function'){ if(put(await v)) return; }
            else if(put(v)) return;
          }
        }
      }
      if(navigator.clipboard && navigator.clipboard.readText){
        if(put(await navigator.clipboard.readText())) return;
      }
      input.focus();
      input.setSelectionRange(0,input.value.length);
    }catch(e){
      input.focus();
      input.setSelectionRange(0,input.value.length);
    }
  });
})();
</script>

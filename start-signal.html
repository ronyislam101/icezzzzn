<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Start Signal - ICE FISHING</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0e1a;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 120, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #0a0e1a;
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            user-select: none;
            animation: fall linear infinite;
        }
        .particle.ice {
            color: rgba(100, 200, 255, 0.05);
            font-size: 0.9rem;
        }
        .particle.fish {
            color: rgba(77, 201, 246, 0.04);
            font-size: 1rem;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.05; }
            90% { opacity: 0.05; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        .header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .brand .logo {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(77, 201, 246, 0.15));
        }

        .header .brand h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header .brand h1 span {
            color: #4dc9f6;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        /* ============================================================
           PAGE TITLE
           ============================================================ */
        .page-title {
            margin-bottom: 20px;
        }

        .page-title h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .page-title p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* ============================================================
           ALERT NOTIFICATION
           ============================================================ */
        .alert-notification {
            background: rgba(255, 215, 0, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.06);
            border-radius: 12px;
            padding: 14px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .alert-notification .icon {
            font-size: 1.2rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .alert-notification .text {
            font-size: 0.75rem;
            color: rgba(255, 215, 0, 0.4);
            line-height: 1.5;
        }

        .alert-notification .text strong {
            color: rgba(255, 215, 0, 0.6);
            font-weight: 600;
        }

        /* ============================================================
           ACTIVATION CODE INPUT
           ============================================================ */
        .code-input-group {
            margin-bottom: 16px;
        }

        .code-input-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .code-input-group label .required {
            color: #ff6b6b;
        }

        .code-input-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            outline: none;
            transition: 0.3s;
            text-align: center;
            letter-spacing: 4px;
        }

        .code-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.08);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .code-input-group input:focus {
            border-color: rgba(77, 201, 246, 0.2);
            background: rgba(77, 201, 246, 0.02);
        }

        .code-input-group input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .code-input-group .hint {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.04);
            margin-top: 4px;
            text-align: center;
        }

        /* ============================================================
           ACTIVATE BUTTON
           ============================================================ */
        .btn-activate {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #4dc9f6, #2b8fc4);
            color: #0a0e1a;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 56px;
        }

        .btn-activate:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(77, 201, 246, 0.2);
        }

        .btn-activate:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-activate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-activate .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 3px solid rgba(10, 14, 26, 0.15);
            border-top: 3px solid #0a0e1a;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .btn-activate .spinner.hidden {
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
           MESSAGE
           ============================================================ */
        .msg {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 400;
            margin: 12px 0 4px;
            display: none;
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .msg.show {
            display: block;
            animation: fade 0.3s ease;
        }

        .msg.error {
            background: rgba(255, 50, 50, 0.06);
            border: 1px solid rgba(255, 50, 50, 0.08);
            color: #ff6b6b;
        }

        .msg.success {
            background: rgba(0, 255, 150, 0.04);
            border: 1px solid rgba(0, 255, 150, 0.06);
            color: #00ff88;
        }

        @keyframes fade {
            0% { opacity: 0; transform: translateY(-4px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           FOOTER
           ============================================================ */
        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.02);
            letter-spacing: 2px;
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .header .brand h1 { font-size: 1rem; }
            .header .brand .logo { font-size: 1.5rem; }
            .page-title h2 { font-size: 1.1rem; }
            .btn-activate { font-size: 0.85rem; padding: 14px; min-height: 50px; }
            .code-input-group input { font-size: 0.85rem; padding: 12px 14px; }
            .alert-notification .text { font-size: 0.65rem; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div id="particles"></div>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <div class="brand">
                <span class="logo">🎣</span>
                <h1>ICE <span>FISHING</span></h1>
            </div>
            <a href="dashboard.html" class="back-btn">← Back</a>
        </div>

        <!-- Page Title -->
        <div class="page-title">
            <h2>🟢 Start Signal</h2>
            <p>Enter your activation code to start the signal</p>
        </div>

        <!-- ============================================================
           ALERT NOTIFICATION
           ============================================================ -->
        <div class="alert-notification">
            <span class="icon">📌</span>
            <span class="text">
                <strong>Complete criteria</strong> and get your activation code from <strong>Deposit Section</strong>.
                Contact admin if you haven't received your code.
            </span>
        </div>

        <!-- ============================================================
           FORM
           ============================================================ -->
        <form id="activateForm" onsubmit="return handleActivate(event)">

            <div class="code-input-group">
                <label>🔑 Activation Code <span class="required">*</span></label>
                <input
                    type="text"
                    id="activationCode"
                    placeholder="Enter activation code"
                    maxlength="20"
                    autofocus
                    required
                    autocomplete="off"
                />
                <div class="hint">Enter the activation code provided by admin</div>
            </div>

            <div id="msg" class="msg">
                <span id="msgText"></span>
            </div>

            <button type="submit" class="btn-activate" id="activateBtn">
                <span class="spinner hidden" id="spinner"></span>
                <span id="btnLabel">🚀 Activate Signal</span>
            </button>
        </form>

        <!-- Footer -->
        <div class="footer">
            Rev.0 Fixed © 2026
        </div>

    </div>

    <!-- ============================================================
       FIREBASE SDK
       ============================================================ -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        // ============================================================
        // PARTICLES
        // ============================================================
        (function createParticles() {
            const container = document.getElementById('particles');
            const ice = ['❄️', '✦', '❄️', '✦'];
            const fish = ['🐟', '🐠', '🐡'];

            for (let i = 0; i < 25; i++) {
                const el = document.createElement('div');
                const isFish = Math.random() < 0.3;
                el.className = 'particle ' + (isFish ? 'fish' : 'ice');
                el.textContent = isFish ?
                    fish[Math.floor(Math.random() * fish.length)] :
                    ice[Math.floor(Math.random() * ice.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 0.8 + 0.5) + 'rem';
                el.style.animationDuration = (Math.random() * 18 + 12) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(el);
            }
        })();

        // ============================================================
        // FIREBASE
        // ============================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ============================================================
        // DOM ELEMENTS
        // ============================================================
        const form = document.getElementById('activateForm');
        const codeInput = document.getElementById('activationCode');
        const msg = document.getElementById('msg');
        const msgText = document.getElementById('msgText');
        const activateBtn = document.getElementById('activateBtn');
        const btnLabel = document.getElementById('btnLabel');
        const spinner = document.getElementById('spinner');

        let currentUser = null;

        // ============================================================
        // CHECK AUTH
        // ============================================================
        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUser = user;
                loadUserActivationStatus(user.uid);
            } else {
                window.location.href = 'index.html';
            }
        });

        // ============================================================
        // START-SIGNAL PAGE MUST ALWAYS ASK FOR THE ACTIVATION CODE
        // ============================================================
        // Do NOT auto-fill/remember an active activation here. Every time the
        // user opens this page they must enter the activation code again. If
        // the same code belongs to this user and its activation is still
        // active, handleActivate() will allow the user back into Signal.

        // ============================================================
        // SHOW MESSAGE
        // ============================================================
        function showMsg(text, type) {
            msgText.textContent = text;
            msg.className = 'msg show ' + type;
        }

        function hideMsg() {
            msg.className = 'msg';
        }

        // ============================================================
        // SET LOADING
        // ============================================================
        function setLoading(loading) {
            activateBtn.disabled = loading;
            if (loading) {
                spinner.classList.remove('hidden');
                btnLabel.textContent = ' Verifying...';
                codeInput.disabled = true;
            } else {
                spinner.classList.add('hidden');
                btnLabel.textContent = '🚀 Activate Signal';
                codeInput.disabled = false;
            }
        }

        // ============================================================
        // HANDLE ACTIVATE
        // ============================================================
        async function handleActivate(e) {
            e.preventDefault();
            hideMsg();

            const code = codeInput.value.trim().toUpperCase();

            if (!code) {
                showMsg('Please enter your activation code.', 'error');
                codeInput.focus();
                return;
            }

            if (!currentUser) {
                showMsg('Please login first.', 'error');
                return;
            }

            setLoading(true);

            try {
                // 1. Check if code exists in activationCodes collection
                const codeQuery = await db
                    .collection('activationCodes')
                    .where('code', '==', code)
                    .get();

                if (codeQuery.empty) {
                    showMsg('❌ Invalid activation code.', 'error');
                    setLoading(false);
                    codeInput.value = '';
                    codeInput.focus();
                    return;
                }

                const codeDoc = codeQuery.docs[0];
                const codeData = codeDoc.data();

                // A code that was already used by THIS SAME USER can be
                // entered again while that user's signal is still active.
                // This is intentional: going Back and returning to Start
                // Signal must show the code form again, not an "already active"
                // page. Other users cannot reuse someone else's code.
                const codeWasUsed = codeData.isUsed === true;
                const usedBy = codeData.usedBy || '';

                if (codeWasUsed && usedBy !== currentUser.uid) {
                    showMsg('❌ This activation code has already been used.', 'error');
                    setLoading(false);
                    codeInput.value = '';
                    codeInput.focus();
                    return;
                }

                // 2. Check expiry
                const expiry = codeData.expiryDate?.toDate?.() || new Date(codeData.expiryDate);
                if (expiry && expiry < new Date()) {
                    showMsg('❌ Activation code has expired. Please contact admin.', 'error');
                    setLoading(false);
                    return;
                }

                // 3. If this is the same user's already-used code, allow it
                // only when the previous activation is still active. This keeps
                // the Start Signal page code-first on every visit without
                // consuming the activation code a second time.
                const userActivations = await db
                    .collection('userActivations')
                    .where('userId', '==', currentUser.uid)
                    .get();

                const now = Date.now();
                const activeActivation = userActivations.docs
                    .map(doc => ({ id: doc.id, ...doc.data() }))
                    .find(item => {
                        if (item.status !== 'active') return false;
                        const exp = item.expiresAt?.toDate?.() || new Date(item.expiresAt);
                        return exp && !Number.isNaN(exp.getTime()) && exp.getTime() > now;
                    });

                if (codeWasUsed && usedBy === currentUser.uid) {
                    if (!activeActivation) {
                        showMsg('❌ This activation has expired. Please get a new activation code.', 'error');
                        setLoading(false);
                        return;
                    }

                    showMsg('✅ Activation verified. Opening Signal...', 'success');
                    setTimeout(() => {
                        window.location.href = 'signal-active.html';
                    }, 500);
                    return;
                }

                if (activeActivation) {
                    showMsg('⚠️ Your current signal is still active. Enter the same activation code to continue.', 'error');
                    setLoading(false);
                    return;
                }

                // 4. Mark a new code as used
                await codeDoc.ref.update({
                    isUsed: true,
                    usedBy: currentUser.uid,
                    usedAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 5. Create user activation record
                const activationDuration = codeData.duration || 24; // hours
                const expiresAt = new Date(Date.now() + activationDuration * 60 * 60 * 1000);

                await db.collection('userActivations').add({
                    userId: currentUser.uid,
                    userName: currentUser.displayName || 'Player',
                    userEmail: currentUser.email || '',
                    activationCode: code,
                    status: 'active',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    expiresAt: expiresAt,
                    duration: activationDuration
                });

                // 6. Update user's package status
                await db.collection('users').doc(currentUser.uid).update({
                    signalActive: true,
                    signalExpiresAt: expiresAt
                });

                showMsg('✅ Signal activated successfully! 🚀', 'success');

                // Disable button and input
                codeInput.disabled = true;
                activateBtn.disabled = true;
                activateBtn.innerHTML = '✅ Signal Active';

                // Redirect to signal page after 2 seconds
                setTimeout(() => {
                    window.location.href = 'signal-active.html';
                }, 2000);

            } catch (error) {
                console.error('Activation Error:', error);
                showMsg('❌ Activation failed: ' + error.message, 'error');
                setLoading(false);
            }
        }

        // Enter key support
        codeInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });

        codeInput.addEventListener('focus', hideMsg);
    </script>

</body>
</html>

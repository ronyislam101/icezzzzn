<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Final - ICE FISHING</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{min-height:100vh;background:#0a0e1a;font-family:Inter,sans-serif;padding:20px;position:relative;overflow-x:hidden}
        .bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse at 50% 30%,rgba(0,150,255,.05),transparent 55%),radial-gradient(ellipse at 50% 80%,rgba(255,215,0,.03),transparent 45%),#0a0e1a}
        #particles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
        .particle{position:absolute;user-select:none;animation:fall linear infinite}
        .particle.ice{color:rgba(100,200,255,.04);font-size:.9rem}
        .particle.fish{color:rgba(77,201,246,.03);font-size:1rem}
        @keyframes fall{0%{transform:translateY(-10vh) rotate(0deg);opacity:0}10%{opacity:.04}90%{opacity:.04}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
        .container{position:relative;z-index:1;max-width:520px;margin:0 auto;padding-bottom:30px}
        .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-top:8px}
        .header .brand{display:flex;align-items:center;gap:12px}
        .header .brand .logo{font-size:2rem;filter:drop-shadow(0 0 20px rgba(77,201,246,.15))}
        .header .brand h1{font-size:1.3rem;font-weight:800;color:#fff;letter-spacing:-.5px}
        .header .brand h1 span{color:#fff}
        .header .back-btn{padding:8px 18px;border:1px solid rgba(255,255,255,.06);border-radius:10px;background:rgba(255,255,255,.02);color:rgba(255,255,255,.3);font-size:.7rem;font-weight:500;cursor:pointer;transition:.3s;text-decoration:none;letter-spacing:.5px}
        .header .back-btn:hover{background:rgba(255,255,255,.04);color:rgba(255,255,255,.6);border-color:rgba(255,255,255,.08);transform:scale(1.02)}
        .page-title{margin-bottom:20px}
        .page-title h2{font-size:1.4rem;font-weight:700;color:#fff}
        .page-title p{font-size:.8rem;color:rgba(255,255,255,.15);margin-top:4px;letter-spacing:.3px}
        .order-summary{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:18px 20px;margin-bottom:20px}
        .order-summary .row{display:flex;justify-content:space-between;padding:4px 0;font-size:.85rem}
        .order-summary .row .label{color:rgba(255,255,255,.15)}
        .order-summary .row .value{color:#fff;font-weight:600}
        .order-summary .divider{height:1px;background:rgba(255,255,255,.03);margin:8px 0}
        .payment-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:24px 22px;margin-bottom:16px}
        .payment-card .method-icon{font-size:3rem;text-align:center;margin-bottom:8px}
        .payment-card .method-name{font-size:1.2rem;font-weight:700;color:#fff;text-align:center}
        .payment-card .method-desc{font-size:.75rem;color:rgba(255,255,255,.12);text-align:center;margin-bottom:16px}
        .payment-card .divider{height:1px;background:rgba(255,255,255,.03);margin:12px 0}
        .payment-card .detail-row{display:flex;justify-content:space-between;padding:6px 0;font-size:.8rem}
        .payment-card .detail-row .label{color:rgba(255,255,255,.15)}
        .payment-card .detail-row .value{color:#fff;font-weight:500}
        .payment-card .address-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.03);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:.7rem;word-break:break-all}
        .payment-card .address-box .address{color:#4dc9f6;font-family:monospace;font-size:.8rem;margin-top:4px;font-weight:600}
        .payment-card .address-box .instruction{color:#d4a017;font-size:.8rem;margin-top:4px;font-weight:600}
        .payment-number-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(77,201,246,.04);border-radius:10px;padding:8px 12px;border:1px solid rgba(77,201,246,.08)}
        .payment-number-box .address{flex:1;min-width:0;color:#4dc9f6;font-family:monospace;font-size:.85rem;font-weight:600}
        .copy-payment-btn{flex:0 0 auto;border:1px solid rgba(77,201,246,.18);background:rgba(77,201,246,.08);color:#4dc9f6;border-radius:9px;padding:9px 15px;font-family:Inter,sans-serif;font-size:.65rem;font-weight:700;cursor:pointer;transition:.3s}
        .copy-payment-btn:hover{background:rgba(77,201,246,.15)}
        .copy-payment-btn.copied{color:#00ff88;border-color:rgba(0,255,136,.18);background:rgba(0,255,136,.08)}
        .btn-confirm{width:100%;padding:16px;border:none;border-radius:12px;background:linear-gradient(135deg,#4dc9f6,#2b8fc4);color:#080c18;font-family:Inter,sans-serif;font-size:.95rem;font-weight:700;cursor:pointer;transition:.3s;margin-top:8px}
        .btn-confirm:hover{transform:translateY(-2px);box-shadow:0 12px 35px rgba(77,201,246,.2)}
        .btn-confirm:active{transform:scale(.97)}
        .btn-confirm:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
        .admin-note{margin-top:16px;padding:12px 16px;border-radius:10px;background:rgba(255,255,255,.01);border:1px dashed rgba(255,255,255,.03);text-align:center}
        .admin-note p{font-size:.55rem;color:rgba(255,255,255,.04);letter-spacing:.5px}
        .method-logo{width:48px;height:48px;object-fit:contain;border-radius:10px;background:rgba(255,255,255,.03);padding:6px;display:inline-block}
        @media(max-width:480px){body{padding:12px}.header .brand h1{font-size:1rem}.header .brand .logo{font-size:1.5rem}.page-title h2{font-size:1.1rem}.payment-card{padding:18px 16px}.payment-card .method-name{font-size:1rem}.order-summary .row{font-size:.75rem}.btn-confirm{font-size:.85rem;padding:14px}}
    </style>
</head>
<body>
    <div class="bg"></div><div id="particles"></div>
    <div class="container">
        <div class="header">
            <div class="brand"><span class="logo">🎣</span><h1>ICE <span>FISHING</span></h1></div>
            <a href="#" class="back-btn" id="backBtn">← Back</a>
        </div>
        <div class="page-title">
            <h2>💳 Payment Instructions</h2>
            <p>Complete your payment using the details below</p>
        </div>
        <div class="order-summary" id="orderSummary">
            <div class="row"><span class="label">📦 Package</span><span class="value" id="pkgName">Loading...</span></div>
            <div class="row"><span class="label">⏱ Duration</span><span class="value" id="pkgDuration">Loading...</span></div>
            <div class="divider"></div>
            <div class="row"><span class="label">💰 Total</span><span class="value" id="totalAmount">$0.00</span></div>
        </div>
        <div class="payment-card" id="paymentCard">
            <div id="paymentContent"><div style="text-align:center;padding:20px;color:rgba(255,255,255,.05)"><p>Loading payment details...</p></div></div>
        </div>
        <button class="btn-confirm" id="confirmBtn" onclick="confirmPayment()">✅ I Have Completed the Payment</button>
        <div class="admin-note"><p>🛠️ Payment details are managed by admin from Firebase Console</p></div>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script>
        (function createParticles(){const c=document.getElementById('particles');const ice=['❄️','✦','❄️','✦'];const fish=['🐟','🐠','🐡'];for(let i=0;i<25;i++){const el=document.createElement('div');const isFish=Math.random()<0.3;el.className='particle '+(isFish?'fish':'ice');el.textContent=isFish?fish[Math.floor(Math.random()*fish.length)]:ice[Math.floor(Math.random()*ice.length)];el.style.left=Math.random()*100+'%';el.style.fontSize=(Math.random()*.8+.5)+'rem';el.style.animationDuration=(Math.random()*18+12)+'s';el.style.animationDelay=(Math.random()*20)+'s';c.appendChild(el)}})();

        const firebaseConfig={apiKey:"AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",authDomain:"ice-fishing-c20bc.firebaseapp.com",projectId:"ice-fishing-c20bc",storageBucket:"ice-fishing-c20bc.firebasestorage.app",messagingSenderId:"220872632937",appId:"1:220872632937:android:71997f3fd7dba6293a90f8"};
        firebase.initializeApp(firebaseConfig);const db=firebase.firestore();const auth=firebase.auth();

        const LOGO_BASE='https://raw.githubusercontent.com/ronyislam101/icezzzzn/main/assets/logo/';
        const methodLogos={bkash:LOGO_BASE+'bkash.png',nagad:LOGO_BASE+'nagad.png',rocket:LOGO_BASE+'rocket.png',paytm:LOGO_BASE+'paytm.png',upi:LOGO_BASE+'upi.png',phonepe:LOGO_BASE+'phonepe.png',gpay:LOGO_BASE+'gpay.png',btc:LOGO_BASE+'btc.png',eth:LOGO_BASE+'eth.png',usdt:LOGO_BASE+'usdt.png',usdc:LOGO_BASE+'usdc.png',ltc:LOGO_BASE+'ltc.png',doge:LOGO_BASE+'doge.png',sol:LOGO_BASE+'sol.png',bnb:LOGO_BASE+'bnb.png',trx:LOGO_BASE+'trx.png'};
        const methodNames={bkash:'Bkash',nagad:'Nagad',rocket:'Rocket',paytm:'Paytm',upi:'UPI',phonepe:'PhonePe',gpay:'GPay',btc:'Bitcoin (BTC)',eth:'Ethereum (ETH)',usdt:'Tether (USDT)',usdc:'USD Coin (USDC)',ltc:'Litecoin (LTC)',doge:'Dogecoin (DOGE)',sol:'Solana (SOL)',bnb:'BNB',trx:'Tron (TRX)'};
        const methodNumbers={bkash:'01785359209',nagad:'01785359210',rocket:'01785359211',paytm:'paytm@upi',upi:'merchant@upi',phonepe:'phonepe@upi',gpay:'gpay@upi',btc:'bc1q7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a',eth:'0x7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a',usdt:'0x7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a',usdc:'0x7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a',ltc:'ltc1q7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a',doge:'D7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a',sol:'7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a',bnb:'0x7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a',trx:'T7a3d5f9e2b1c8a4d6f9e3b7c2d1a5f8e9b3c7d1a'};

        let selectedPackage=null,fromPage='',selectedMethod='',selectedRegion='',usdtToInr=85;

        function getPackageId(){const p=new URLSearchParams(window.location.search);return p.get('package')}
        function getMethod(){const p=new URLSearchParams(window.location.search);return p.get('method')}
        function getRegion(){const p=new URLSearchParams(window.location.search);return p.get('region')||'worldwide'}
        function getReferrer(){const p=new URLSearchParams(window.location.search);return p.get('from')||'dashboard'}

        function setBackButton(){const back=document.getElementById('backBtn');fromPage=getReferrer();const pkgId=getPackageId();if(fromPage==='login')back.href='index.html';else back.href='payment-details.html?package='+pkgId+'&region='+getRegion()+'&from='+fromPage}

        async function fetchUSDTRate(){try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=inr');const d=await r.json();if(d&&d.tether&&d.tether.inr)usdtToInr=d.tether.inr}catch(e){}}

        function renderPaymentDetails(){
            const pkgId=getPackageId();selectedMethod=getMethod();selectedRegion=getRegion();
            if(!pkgId||!selectedMethod){document.getElementById('paymentContent').innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,.05)"><p>❌ Invalid payment request.</p></div>';return}
            db.collection('packagePrices').doc('packages').get().then(async(doc)=>{await fetchUSDTRate();if(doc.exists){const data=doc.data();const pkg=data[pkgId];if(pkg){selectedPackage={id:pkgId,...pkg};const inrAmount=pkg.inr||0,bdtAmount=Math.round(inrAmount*1.4);let totalDisplay='$'+(pkg.usdt||0).toFixed(2)+' USDT';if(selectedRegion==='bangladesh')totalDisplay='৳'+bdtAmount.toLocaleString()+' BDT';else if(selectedRegion==='india')totalDisplay='₹'+inrAmount.toLocaleString()+' INR';document.getElementById('pkgName').textContent=pkg.name||'Package';document.getElementById('pkgDuration').textContent=pkg.duration||'-';document.getElementById('totalAmount').textContent=totalDisplay;

            const logo=methodLogos[selectedMethod]||null;const methodName=methodNames[selectedMethod]||selectedMethod.toUpperCase();const paymentNumber=methodNumbers[selectedMethod]||'N/A';const logoHtml=logo?'<img src="'+logo+'" alt="'+methodName+'" class="method-logo" onerror="this.style.display=\'none\'">':'<span style="font-size:2.5rem;">💳</span>';
            document.getElementById('paymentContent').innerHTML=`
                <div style="text-align:center;margin-bottom:12px;">${logoHtml}</div>
                <div class="method-name">${methodName}</div>
                <div class="method-desc">Complete your payment</div>
                <div class="divider"></div>
                <div style="font-size:.7rem;color:rgba(255,255,255,.06);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">📤 SEND TO (${methodName.toUpperCase()} NUMBER/ADDRESS)</div>
                <div class="address-box payment-number-box">
                    <div class="address" id="paymentNumberValue">${paymentNumber}</div>
                    <button type="button" class="copy-payment-btn" onclick="copyPaymentNumber()">📋 Copy</button>
                </div>
                <div style="font-size:.7rem;color:rgba(255,255,255,.06);text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px;">💡 What to do?</div>
                <div class="address-box"><div class="instruction">Send Money / Cash Out</div></div>
                <div class="divider"></div>
                <div style="display:flex;justify-content:space-between;padding-top:4px;">
                    <span style="font-size:.65rem;color:rgba(255,255,255,.06);">💡 After payment, click the button below</span>
                    <span style="font-size:.65rem;color:rgba(255,255,255,.06);">⏱ 1-5 mins</span>
                </div>
            `;}}}).catch(e=>{console.error(e);document.getElementById('paymentContent').innerHTML='<div style="text-align:center;padding:20px;color:rgba(255,255,255,.05)"><p>❌ Error loading payment details</p></div>'})}

        function copyPaymentNumber(){const el=document.getElementById('paymentNumberValue');const btn=document.querySelector('.copy-payment-btn');if(!el||!btn)return;const value=el.textContent.trim();const done=()=>{btn.textContent='✅ Copied';btn.classList.add('copied');setTimeout(()=>{btn.textContent='📋 Copy';btn.classList.remove('copied')},1800)};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(value).then(done).catch(()=>fallbackCopy(value,done))}else fallbackCopy(value,done)}

        function fallbackCopy(value,done){const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta);done()}

        function confirmPayment(){const btn=document.getElementById('confirmBtn');if(!selectedPackage){alert('❌ No package selected.');return}btn.disabled=true;btn.innerHTML='<span style="display:inline-block;width:18px;height:18px;border:2px solid rgba(8,12,24,.15);border-top:2px solid #080c18;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px;"></span> Redirecting...';const pkgId=getPackageId(),method=getMethod(),region=getRegion(),from=getReferrer();setTimeout(()=>{window.location.href='payment-submit.html?package='+encodeURIComponent(pkgId)+'&method='+encodeURIComponent(method)+'&region='+encodeURIComponent(region)+'&from='+encodeURIComponent(from)},400)}

        auth.onAuthStateChanged(user=>{setBackButton();renderPaymentDetails()});
    </script>
</body>
</html>

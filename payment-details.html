<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Methods - ICE FISHING</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080c18;
            font-family: 'Inter', sans-serif;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 50% 30%, rgba(0, 180, 255, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 215, 0, 0.03) 0%, transparent 45%),
                #080c18;
        }

        #particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            user-select: none;
            animation: fall linear infinite;
        }

        .particle.ice {
            color: rgba(100, 200, 255, 0.05);
            font-size: 0.9rem;
        }
        .particle.fish {
            color: rgba(77, 201, 246, 0.04);
            font-size: 1rem;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.05; }
            90% { opacity: 0.05; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 520px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-top: 8px;
        }

        .header .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .brand .logo {
            font-size: 2rem;
            filter: drop-shadow(0 0 20px rgba(77, 201, 246, 0.15));
        }

        .header .brand h1 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header .brand h1 span {
            color: #ffffff;
        }

        .header .back-btn {
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .header .back-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        .page-title {
            margin-bottom: 20px;
        }

        .page-title h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
        }

        .page-title p {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.15);
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .order-summary {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 20px;
        }

        .order-summary .row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
        }

        .order-summary .row .label {
            color: rgba(255, 255, 255, 0.15);
        }

        .order-summary .row .value {
            color: #ffffff;
            font-weight: 600;
        }

        .order-summary .row .value.usdt {
            color: #4dc9f6;
        }

        .order-summary .row .value.inr {
            color: #ffd700;
        }

        .order-summary .row .value.bdt {
            color: #00ff88;
        }

        .order-summary .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.03);
            margin: 8px 0;
        }

        .region-header {
            text-align: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            margin-bottom: 16px;
        }

        .region-header .flag {
            font-size: 2.5rem;
        }

        .region-header .name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 4px;
        }

        .region-header .desc {
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.12);
        }

        .payment-methods {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .payment-method {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .payment-method:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .payment-method .left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .payment-method .left .icon {
            font-size: 2rem;
            width: 44px;
            text-align: center;
        }

        .payment-method .left .info .name {
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
        }

        .payment-method .left .info .desc {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.12);
        }

        .payment-method .right .arrow {
            color: rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
        }

        .payment-method:hover .right .arrow {
            color: rgba(255, 255, 255, 0.15);
        }

        .payment-method .right .badge {
            font-size: 0.5rem;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(255, 215, 0, 0.06);
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 8px;
        }

        .admin-note {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px dashed rgba(255, 255, 255, 0.03);
            text-align: center;
        }

        .admin-note p {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.04);
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header .brand h1 { font-size: 1rem; }
            .header .brand .logo { font-size: 1.5rem; }
            .page-title h2 { font-size: 1.1rem; }
            .payment-method { padding: 12px 14px; }
            .payment-method .left .icon { font-size: 1.5rem; width: 36px; }
            .payment-method .left .info .name { font-size: 0.8rem; }
            .order-summary .row { font-size: 0.75rem; }
        }
    </style>
</head>
<body>

    <div class="bg"></div>
    <div id="particles"></div>

    <div class="container">

        <div class="header">
            <div class="brand">
                <span class="logo">🎣</span>
                <h1>ICE <span>FISHING</span></h1>
            </div>
            <a href="#" class="back-btn" id="backBtn">← Back</a>
        </div>

        <div class="page-title">
            <h2>💳 Payment Methods</h2>
            <p>Select your preferred payment method</p>
        </div>

        <div class="order-summary" id="orderSummary">
            <div class="row">
                <span class="label">📦 Package</span>
                <span class="value" id="pkgName">Loading...</span>
            </div>
            <div class="row">
                <span class="label">⏱ Duration</span>
                <span class="value" id="pkgDuration">Loading...</span>
            </div>
            <div class="divider"></div>
            <div class="row">
                <span class="label">💰 Total</span>
                <span class="value" id="totalAmount">$0.00</span>
            </div>
        </div>

        <div class="region-header" id="regionHeader">
            <div class="flag" id="regionFlag">🌍</div>
            <div class="name" id="regionName">Worldwide</div>
            <div class="desc" id="regionDesc">Select your payment method</div>
        </div>

        <div class="payment-methods" id="paymentMethods">
            <div style="text-align:center; padding:20px; color:rgba(255,255,255,0.05);">
                <p>Loading payment methods...</p>
            </div>
        </div>

        <div class="admin-note">
            <p>🛠️ Payment methods & details are managed by admin from Firebase Console</p>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js">
    </script>

    <script>
        (function createParticles() {
            const container = document.getElementById('particles');
            const ice = ['❄️', '✦', '❄️', '✦'];
            const fish = ['🐟', '🐠', '🐡'];

            for (let i = 0; i < 25; i++) {
                const el = document.createElement('div');
                const isFish = Math.random() < 0.3;
                el.className = 'particle ' + (isFish ? 'fish' : 'ice');
                el.textContent = isFish ?
                    fish[Math.floor(Math.random() * fish.length)] :
                    ice[Math.floor(Math.random() * ice.length)];
                el.style.left = Math.random() * 100 + '%';
                el.style.fontSize = (Math.random() * 0.8 + 0.5) + 'rem';
                el.style.animationDuration = (Math.random() * 18 + 12) + 's';
                el.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(el);
            }
        })();

        const firebaseConfig = {
            apiKey: "AIzaSyDFZpetqOy3nHj27rUo7js6Bny79sxnYvU",
            authDomain: "ice-fishing-c20bc.firebaseapp.com",
            projectId: "ice-fishing-c20bc",
            storageBucket: "ice-fishing-c20bc.firebasestorage.app",
            messagingSenderId: "220872632937",
            appId: "1:220872632937:android:71997f3fd7dba6293a90f8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let selectedPackage = null;
        let fromPage = '';
        let selectedRegion = '';
        let usdtToInr = 85.0;
        let usdtToBdt = 120.0;

        function getPackageId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('package');
        }

        function getRegion() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('region') || 'worldwide';
        }

        function getReferrer() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('from') || 'dashboard';
        }

        function setBackButton() {
            const backBtn = document.getElementById('backBtn');
            fromPage = getReferrer();
            const pkgId = getPackageId();

            if (fromPage === 'login') {
                backBtn.href = 'index.html';
            } else {
                backBtn.href = 'payment.html?package=' + pkgId + '&from=' + fromPage;
            }
        }

        async function fetchUSDTRate() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=inr');
                const data = await response.json();
                if (data && data.tether && data.tether.inr) {
                    usdtToInr = data.tether.inr;
                }
            } catch (error) { console.error('Error fetching USDT rate:', error); }
            usdtToBdt = usdtToInr * 1.4;
        }

        function getPaymentMethods(region, pkg) {
            const inrAmount = pkg.inr || 0;
            const bdtAmount = Math.round(inrAmount * 1.4);
            const usdtAmount = pkg.usdt || (inrAmount / usdtToInr);

            const methods = {
                bangladesh: {
                    flag: '🇧🇩',
                    name: 'Bangladesh',
                    desc: 'Mobile banking payments',
                    methods: [
                        { id: 'bkash', icon: '💚', name: 'Bkash', desc: 'Send money via bKash', amount: '৳' +
                                bdtAmount.toLocaleString() },
                        { id: 'nagad', icon: '🟠', name: 'Nagad', desc: 'Send money via Nagad', amount: '৳' +
                                bdtAmount.toLocaleString() },
                        { id: 'rocket', icon: '🚀', name: 'Rocket', desc: 'Send money via Rocket', amount: '৳' +
                                bdtAmount.toLocaleString() }
                    ]
                },
                india: {
                    flag: '🇮🇳',
                    name: 'India',
                    desc: 'UPI & Mobile payments',
                    methods: [
                        { id: 'paytm', icon: '💳', name: 'Paytm', desc: 'Paytm wallet & UPI', amount: '₹' +
                                inrAmount.toLocaleString() },
                        { id: 'upi', icon: '🇮🇳', name: 'UPI', desc: 'Google Pay · PhonePe · GPay', amount: '₹' +
                                inrAmount.toLocaleString() },
                        { id: 'phonepe', icon: '📱', name: 'PhonePe', desc: 'PhonePe UPI payments', amount: '₹' +
                                inrAmount.toLocaleString() },
                        { id: 'gpay', icon: '💚', name: 'GPay (Google Pay)', desc: 'Google Pay UPI', amount: '₹' +
                                inrAmount.toLocaleString() }
                    ]
                },
                worldwide: {
                    flag: '🌍',
                    name: 'Worldwide',
                    desc: 'Cryptocurrency payments',
                    methods: [
                        { id: 'btc', icon: '₿', name: 'Bitcoin (BTC)', desc: 'Send BTC', amount: (usdtAmount /
                                0.000002).toFixed(8) + ' BTC' },
                        { id: 'eth', icon: '⟠', name: 'Ethereum (ETH)', desc: 'Send ETH', amount: (usdtAmount /
                                0.00004).toFixed(6) + ' ETH' },
                        { id: 'usdt', icon: '🪙', name: 'Tether (USDT)', desc: 'Send USDT (ERC20/BEP20/TRC20)',
                            amount: usdtAmount.toFixed(2) + ' USDT' },
                        { id: 'usdc', icon: '💵', name: 'USD Coin (USDC)', desc: 'Send USDC (ERC20/BEP20)',
                            amount: usdtAmount.toFixed(2) + ' USDC' },
                        { id: 'ltc', icon: 'Ł', name: 'Litecoin (LTC)', desc: 'Send LTC', amount: (usdtAmount /
                                0.002).toFixed(6) + ' LTC' },
                        { id: 'doge', icon: '🐕', name: 'Dogecoin (DOGE)', desc: 'Send DOGE', amount: (usdtAmount /
                                0.00008).toFixed(0) + ' DOGE' },
                        { id: 'sol', icon: '☀️', name: 'Solana (SOL)', desc: 'Send SOL', amount: (usdtAmount /
                                0.003).toFixed(6) + ' SOL' },
                        { id: 'bnb', icon: '🔶', name: 'BNB', desc: 'Send BNB (BEP20)', amount: (usdtAmount /
                                0.0006).toFixed(6) + ' BNB' },
                        { id: 'trx', icon: '🔴', name: 'Tron (TRX)', desc: 'Send TRX (TRC20)', amount: (usdtAmount /
                                0.002).toFixed(0) + ' TRX' }
                    ]
                }
            };

            return methods[region] || methods.worldwide;
        }

        function methodRegionsMatch(m, region) {
            const wanted = String(region || '').toLowerCase();
            const list = Array.isArray(m.regions) ? m.regions.map(x => String(x).toLowerCase()) : [];
            if (list.length) return list.includes(wanted);
            return !m.region || String(m.region).toLowerCase() === wanted;
        }

        function renderAdminMethods(snapshot, pkg) {
            const methods = [];
            snapshot.forEach(doc => {
                const m = { id: doc.id, ...doc.data() };
                if (m.isActive === false || m.enabled === false || m.packagePayment === false) return;
                if (!methodRegionsMatch(m, selectedRegion)) return;
                methods.push(m);
            });

            const inrAmount = pkg.inr || 0;
            const bdtAmount = Math.round(inrAmount * 1.4);
            const usdtAmount = pkg.usdt || (inrAmount / usdtToInr);
            const amount = selectedRegion === 'bangladesh'
                ? '৳' + bdtAmount.toLocaleString() + ' BDT'
                : selectedRegion === 'india'
                    ? '₹' + inrAmount.toLocaleString() + ' INR'
                    : usdtAmount.toFixed(2) + ' USDT';

            document.getElementById('regionFlag').textContent = selectedRegion === 'bangladesh' ? '🇧🇩' : selectedRegion === 'india' ? '🇮🇳' : '🌍';
            document.getElementById('regionName').textContent = selectedRegion === 'bangladesh' ? 'Bangladesh' : selectedRegion === 'india' ? 'India' : 'Worldwide';
            document.getElementById('regionDesc').textContent = 'Available payment methods';

            const container = document.getElementById('paymentMethods');
            if (!methods.length) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,.55)"><p>No active package payment methods available for this region.</p></div>';
                return;
            }
            container.innerHTML = methods.map((m, index) => `
                <a href="#" class="payment-method" onclick="selectMethod('${m.id}'); return false;">
                    <div class="left">
                        <span class="icon">${m.icon || '💳'}</span>
                        <div class="info">
                            <div class="name">${m.name || m.method || m.label || m.id}</div>
                            <div class="desc">${m.instruction || m.action || 'Send Payment'} · ${amount}</div>
                        </div>
                    </div>
                    <div class="right">${index === 0 ? '<span class="badge">Popular</span>' : ''}<span class="arrow">→</span></div>
                </a>`).join('');
        }

        function renderPaymentMethods() {
            const pkgId = getPackageId();
            selectedRegion = getRegion();
            if (!pkgId) {
                document.getElementById('paymentMethods').innerHTML = '<div style="text-align:center;padding:20px"><p>❌ No package selected.</p></div>';
                return;
            }
            db.collection('packagePrices').doc('packages').get().then(async (doc) => {
                await fetchUSDTRate();
                if (!doc.exists || !doc.data()[pkgId]) throw new Error('Package not found');
                const pkg = { id: pkgId, ...doc.data()[pkgId] };
                selectedPackage = pkg;
                const inrAmount = pkg.inr || 0;
                const bdtAmount = Math.round(inrAmount * 1.4);
                const usdtAmount = pkg.usdt || (inrAmount / usdtToInr);
                document.getElementById('pkgName').textContent = pkg.name || 'Package';
                document.getElementById('pkgDuration').textContent = pkg.duration || '-';
                document.getElementById('totalAmount').textContent = selectedRegion === 'bangladesh' ? '৳' + bdtAmount.toLocaleString() + ' BDT' : selectedRegion === 'india' ? '₹' + inrAmount.toLocaleString() + ' INR' : usdtAmount.toFixed(2) + ' USDT';
                db.collection('paymentMethods').onSnapshot(snapshot => renderAdminMethods(snapshot, pkg), error => {
                    console.error(error);
                    document.getElementById('paymentMethods').innerHTML = '<div style="text-align:center;padding:20px"><p>❌ Error loading payment methods</p></div>';
                });
            }).catch(error => {
                console.error(error);
                document.getElementById('paymentMethods').innerHTML = '<div style="text-align:center;padding:20px"><p>❌ Error loading package</p></div>';
            });
        }

        function selectMethod(methodId) {
            const pkgId = getPackageId();

            window.location.href = 'payment-final.html?package=' + pkgId + '&method=' + methodId + '&region=' +
                selectedRegion + '&from=' + fromPage;
        }

        auth.onAuthStateChanged((user) => {
            setBackButton();
            renderPaymentMethods();
        });
    </script>

</body>
</html>
